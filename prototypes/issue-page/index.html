<!doctype html>
<!--
  PROTOTYPE, throwaway. Do not build on this code.

  Question ("Prototype the issue page with its cross-repo blocking chains", issue #4 under
  "Map: Verdandi MVP spec"): how should the issue page show an issue, its parent issue, its
  sub-issues and its blocking chains across repositories, and how does one move along a chain?

  Plan: three structurally different issue pages inside the app shell and issue list that won the
  earlier prototypes, switchable via ?variant=A|B|C (floating bar at the bottom, or Shift+Left/Right).
  The prototype opens on a hub issue with deep chains in both directions; the bar's issue menu jumps
  to the other showcases (epic, long sequence, external issue, cycle, closed issue, nothing related).
  Every variant takes a different stance on every open question:

                        A  Rail                      B  Map                        C  Path
    layout              GitHub's: content left,      relationships first: a map    split: a relationship spine
                          relationships in a rail      on top, content below         left, content right
    blocking chains     indented trees               left-to-right graph, one      one ordered timeline through
                                                       column per step               this issue, "ready now" marked
    depth shown         direct only; expand a        two steps each way, then      everything
                          tree to go further           "+N more"
    closed blockers     shown, not followed          shown, not followed           shown and followed (history)
    diamonds / cycles   issue repeats per route;     drawn once, two arrows;       listed once, "unblocks" names
                          cycle row marks the loop     cycle as a red loop           both; cycle noted on the item
    external issues     "external" tag               dashed card, outlined chip    outlined owner/repo chip
    parent issue        rail, with the ancestry      breadcrumb above the title    "Part of" at the top of the
                          path                                                       spine
    sub-issues          panel under the body         the list's outline, above     spine section, fully expanded
                          (as GitHub does)             the body
    labels              rail section; dots in rows   by the state; dots on cards   under the title; pills in rows
    keys                j/k through links, ←/→ fold  arrows move across the map    j/k walk the spine

  Verdict: B (Map) wins, as prototyped. A and C stay here for reference.

  Synthetic data only; nothing is persisted. The issue list is the decided one (variant A of the
  issue-list prototype) and is not up for review here.

  Run: open this file in a browser.
-->

// ---------- blocking chains (shared) ----------
const nbr = (x, dir) => dir === 'up' ? ISSUES.get(x).blockedBy : ISSUES.get(x).blocking;
// Every issue reachable from k by following blocking relationships in one direction ('up': what blocks
// it, 'down': what waits on it). depth = longest route from k, so an issue reached along two routes (a
// diamond) sits beyond both. An edge back to an issue on the current route closes a cycle and is
// flagged instead of followed. Closed issues are shown but only followed when throughClosed is set.
// Edge a -> b: b is one step farther from k than a.
function reach(k, dir, throughClosed) {
  const nodes = new Map([[k, { key: k, depth: 0 }]]), edges = [], onRoute = new Set(), done = new Set(), post = [];
  const follow = x => x === k || throughClosed || ISSUES.get(x).state === 'open';
  const dfs = x => {
    onRoute.add(x);
    if (follow(x)) for (const y of nbr(x, dir)) {
      if (onRoute.has(y)) { edges.push({ a: x, b: y, cycle: true }); continue; }
      edges.push({ a: x, b: y, cycle: false });
      if (!nodes.has(y)) nodes.set(y, { key: y, depth: 0 });
      if (!done.has(y)) dfs(y);
    }
    onRoute.delete(x); done.add(x); post.push(x);
  };
  dfs(k);
  const out = new Map();
  for (const e of edges) if (!e.cycle) { if (!out.has(e.a)) out.set(e.a, []); out.get(e.a).push(e.b); }
  for (const x of post.reverse()) for (const y of out.get(x) ?? []) nodes.get(y).depth = Math.max(nodes.get(y).depth, nodes.get(x).depth + 1);
  return { nodes, edges };

const beyond = (k, dir) => reach(k, dir, false).nodes.size - 1;

// ---------- the issue list (decided; not up for review here) ----------
function memberKeys(id) {

}
const sortRoots = keys => keys.slice().sort((a, b) => {

  keys: [['← → ↑ ↓ / h j k l', 'Move across the page spatially: ← toward blockers, → toward waiting issues, ↓ below the map reaches the sub-issues'], ['↵ or click', 'Open the issue page; on "+N more", draw the whole chain'], ['Space ⇧Space', 'Scroll the page']],
  hint: '<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open',
  CW: 150, SW: 92, CH: 60, GAP: 34, VG: 12, PAD: 16, HEAD: 32,
  html(it, pg) {
    const home = it.repo, anc = ancestors(it);
    const crumbs = `<nav class="crumbs">${anc.map(k => { const a = ISSUES.get(k); return `<span class="crumb" data-nav="anc:${esc(k)}" data-act="open" data-arg="${esc(k)}" title="${esc(k)}: ${esc(a.title)}">${stIcon(a)}<span class="num">${esc(refShort(k, home))}</span><span class="t">${esc(a.title)}</span>${extTag(a)}</span><span class="muted">›</span>`; }).join('')}`
      + `<span class="crumb" style="cursor:default">${I.repo}${esc(it.repo)} #${it.number}${extTag(it)}</span></nav>`;
    const meta = `<div class="metaline">${statePill(it)}${blockPills(it)}${it.labels.map(labelPill).join('')}`
      + `${it.assignees.length ? `<span class="avs" title="Assigned to ${esc(it.assignees.join(', '))}">${it.assignees.map(p => avatar(p, 'sm')).join('')}</span>` : ''}`

      + `<div class="pb-body md">${bodyHTML(it)}</div>${commentsHTML(it)}</article>`;
  },
  map(it, pg) {
    const MAX = pg.full ? Infinity : 2, P = new Map(), cols = new Map(), edges = [], seen = new Set();
    const add = (id, col, o) => { P.set(id, { id, col, ...o }); if (!cols.has(col)) cols.set(col, []); cols.get(col).push(id); };

      for (const n of R.nodes.values()) if (n.key !== it.key) { if (n.depth <= MAX) add(idOf(n.key), sgn * n.depth, { key: n.key }); else hidden++; }
      const stub = hidden ? `${dir}:more` : null;
      if (stub) add(stub, sgn * (MAX + 1), { stub: true, n: hidden });

        const a = idOf(e.a), b = P.has(idOf(e.b)) ? idOf(e.b) : stub;
        if (!P.has(a) || !b) continue;

    const rowsMax = Math.max(...[...cols.values()].map(c => c.length)), ypos = new Map(), { CW, SW, CH, GAP, VG, PAD, HEAD } = this;
    for (const c of [...cols.keys()].sort((a, b) => Math.abs(a) - Math.abs(b))) {
      const ids = cols.get(c);
      if (c !== 0) {
        const score = id => {
          if (P.get(id).stub) return 1e9;
          const ys = edges.filter(e => e.from === id || e.to === id).map(e => ypos.get(e.from === id ? e.to : e.from)).filter(y => y !== undefined);
          return ys.length ? ys.reduce((s, y) => s + y, 0) / ys.length : 1e8;
        };
        const sc = new Map(ids.map(id => [id, score(id)]));
        ids.sort((a, b) => sc.get(a) - sc.get(b));
      }

    const colX = new Map(), isStub = c => cols.get(c).every(id => P.get(id).stub);

    for (const c of [...cols.keys()].sort((a, b) => a - b)) { colX.set(c, x); x += (isStub(c) ? SW : CW) + GAP; }
    const W = Math.max(x - GAP + PAD, 560), H = HEAD + rowsMax * (CH + VG) - VG + PAD;
    for (const p of P.values()) { p.x = colX.get(p.col); p.y = ypos.get(p.id); p.w = p.stub ? SW : CW; }
    const path = e => {

      if (x2 > x1) { const dx = Math.max(14, (x2 - x1) / 2); return `M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`; }
      const yb = H - 4, fx = f.x + f.w / 2, tx = t.x + t.w / 2; // a cycle runs backwards: loop under the cards
      return `M${fx} ${f.y + CH}C${fx} ${yb} ${tx} ${yb} ${tx} ${t.y + CH}`;

    const marker = (id, cls) => `<marker id="${id}" class="${cls}" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L6 3L0 6z"/></marker>`;
    const svgEl = `<svg class="pb-svg" width="${W}" height="${H}"><defs>${marker('pb-arr', '')}${marker('pb-arr-c', 'cyc')}</defs>`
      + edges.map(e => `<path class="e ${e.cycle ? 'cyc' : e.live ? '' : 'dead'} ${e.more ? 'more' : ''}" d="${path(e)}" marker-end="url(#${e.cycle ? 'pb-arr-c' : 'pb-arr'})"/>`).join('') + '</svg>';
    const colLabel = c => c === 0 ? 'This issue' : c === -1 ? 'Blocked by' : c === 1 ? 'Blocks' : c < 0 ? `${-c} steps back` : `${c} steps on`;
    const heads = [...cols.keys()].filter(c => !isStub(c)).map(c => `<div class="pb-colh ${c === 0 ? 'c0' : ''}" style="left:${colX.get(c)}px;width:${CW}px">${colLabel(c)}</div>`).join('');
    const node = p => {
      if (p.stub) return `<div class="node stub" style="left:${p.x}px;top:${p.y}px;width:${SW}px" data-nav="${esc(p.id)}" data-act="full" title="Draw the whole chain">+${p.n} more</div>`;
      const n = ISSUES.get(p.key);
      return `<div class="node ${n.state} ${isTracked(n.repo) ? '' : 'x'} ${p.center ? 'center' : ''} ${isBlocked(n) ? 'isblk' : ''}" style="left:${p.x}px;top:${p.y}px" data-nav="${esc(p.id)}" ${p.center ? '' : `data-act="open" data-arg="${esc(n.key)}"`} title="${esc(n.key)}: ${esc(n.title)}">`
        + `<div class="n1">${readyIcon(n)}${n.repo !== it.repo ? repoChip(n.repo) : ''}<span class="num">#${n.number}</span><span class="sp"></span>${labelDots(n)}</div><div class="n2">${esc(n.title)}</div></div>`;
    };
    const lonely = P.size === 1 ? `<div class="pb-note" style="left:${colX.get(0) + CW + 16}px;top:${HEAD + CH / 2 - 9}px">No blocking relationships</div>` : '';
    const legend = P.size > 1 ? `<div class="pb-legend"><span>arrows point at the issue that waits</span><span><svg width="24" height="8"><path d="M1 4H23" stroke="currentColor" stroke-dasharray="3 3"/></svg>no longer blocking</span><span><span class="st st-blocked">${I.blocked}</span>blocked</span><span>dashed card: external</span>${pg.full ? '' : '<span>two steps each way; "+N more" draws the rest</span>'}</div>` : '';
    return `<section class="pb-map"><div class="pb-canvas" style="width:${W}px;height:${H}px">${svgEl}${heads}${[...P.values()].map(node).join('')}${lonely}</div></section>${legend}`;

  subs(it, pg, home) {

    m.scrollLeft = pg.mapScroll;

  },

    pages: S.pages.map(p => ({ key: p.key, cursor: p.cur, expanded: [...p.exp], full: p.full || undefined })),
    [top ? 'pageIssue' : 'selectedIssue']: it && {
      ref: it.key, state: it.state, stateReason: it.reason, tracked: isTracked(it.repo), ancestors: ancestors(it),
      '// as GitHub reports it (one request per relationship list)': '',
      subIssuesSummary: { total: it.subs.length, completed: doneSubs(it) },
      issueDependenciesSummary: { blockedBy: openBlockers(it).length, totalBlockedBy: it.blockedBy.length, blocking: openBlocked(it).length, totalBlocking: it.blocking.length },
      [`// transitive; ${thru ? 'C follows closed issues' : 'A and B stop at closed issues'}`]: '',
      upstream: chainOut('up'), downstream: chainOut('down'),
    },
  }, null, 2);
}
let toastTimer;
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, ms); }

// ---------- actions ----------
function activate(id) { S.active = id; S.pages = []; render(); }
function openIssue(k) {
  if (S.pages.at(-1)?.key === k) { toast('Already on this issue\'s page'); return; }
  S.pages.push(newPage(k)); S.focus = 'main'; render();
}
function popPage() { S.pages.pop(); render(); }
function toList() { S.pages = []; render(); }
function gh(k) { if (!k) return; const it = ISSUES.get(k); toast(`Would open https://github.com/${it.repo}/issues/${it.number} in the browser`); }
function toggleKey(k) { const ls = lstate(S.active); ls.expanded.has(k) ? ls.expanded.delete(k) : ls.expanded.add(k); render(); }
const curRows = () => LIST.rows(S.active).rows;
function moveSel(d) {
  const rows = curRows(), ls = lstate(S.active);
  if (!rows.length) return;
  ls.sel = rows[Math.max(0, Math.min(rows.length - 1, selIndex(rows) + d))].id; S.scrollSel = true; render();
}
function goRight() {
  const rows = curRows(), ls = lstate(S.active), i = selIndex(rows), r = rows[i];
  if (!r) return;
  if (r.kids && !r.exp) ls.expanded.add(r.k);
  else if (r.kids && rows[i + 1]) { ls.sel = rows[i + 1].id; S.scrollSel = true; }
  render();
}
function goLeft() {
  const rows = curRows(), ls = lstate(S.active), i = selIndex(rows), r = rows[i];
  if (!r) return;
  if (r.exp) ls.expanded.delete(r.k);
  else if (r.d > 0) for (let j = i - 1; j >= 0; j--) if (rows[j].d === r.d - 1) { ls.sel = rows[j].id; S.scrollSel = true; break; }
  render();
}
function enterRow(rid) {
  const rows = curRows(), ls = lstate(S.active);
  if (rid) ls.sel = rid;
  const r = rows[selIndex(rows)];
  if (r) openIssue(r.k);
}
function toggleAll() {
  const ls = lstate(S.active);
  if (curRows().some(r => r.kids && !r.exp)) [...ISSUES.values()].forEach(x => { if (x.subs.length) ls.expanded.add(x.key); });
  else ls.expanded.clear();
  S.scrollSel = true; render();
}
// issue page cursor
function pageMove(d) {
  const top = S.pages.at(-1), els = navEls();
  if (!els.length) return;
  const i = els.findIndex(x => x.dataset.nav === top.cur);
  top.cur = els[i < 0 ? (d > 0 ? 0 : els.length - 1) : Math.max(0, Math.min(els.length - 1, i + d))].dataset.nav;
  S.scrollLink = true; render();
}
function pageSpatial(dx, dy) {
  const top = S.pages.at(-1), els = navEls(), cur = els.find(x => x.dataset.nav === top.cur);
  if (!cur) { if (els.length) { top.cur = els[0].dataset.nav; S.scrollLink = true; render(); } return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const x of els) {
    if (x === cur) continue;
    const b = x.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const p = dx ? (bx - ax) * dx : (by - ay) * dy;
    if (p <= 4) continue;
    const s = p + (dx ? Math.abs(by - ay) : Math.abs(bx - ax)) * 2.5;
    if (s < bs) { bs = s; best = x; }
  }
  if (best) { top.cur = best.dataset.nav; S.scrollLink = true; render(); }
}
function pageFold(open) {
  const top = S.pages.at(-1), cur = navEls().find(x => x.dataset.nav === top.cur);
  if (!cur) return;
  const id = cur.dataset.nav, kids = !!cur.dataset.kids, exp = !!cur.dataset.exp;
  if (open) {
    if (kids && !exp) top.exp.add(id);
    else if (kids && exp) { const els = navEls(), i = els.indexOf(cur); if (els[i + 1]) { top.cur = els[i + 1].dataset.nav; S.scrollLink = true; } }
  } else if (kids && exp) top.exp.delete(id);
  else if (id.includes('>')) { top.cur = id.slice(0, id.lastIndexOf('>')); S.scrollLink = true; }
  render();
}
function pageEnter() {
  const top = S.pages.at(-1), cur = navEls().find(x => x.dataset.nav === top.cur);
  if (!cur) return;
  if (cur.dataset.act === 'open') openIssue(cur.dataset.arg);
  else if (cur.dataset.act === 'full') { top.full = true; top.mapScroll = undefined; render(); }
  else toast('This issue\'s page is already open');
}
function pageScroll(d) { const c = $('scr'), m = c.querySelector('[data-scroll]') ?? c; m.scrollBy({ top: d * m.clientHeight * 0.8, behavior: 'smooth' }); }
function setVariant(v) {
  closeHelp(false);
  S.variant = v;
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render(); toast(PV().blurb, 6500);
}
const cycle = d => setVariant(KEYS[(KEYS.indexOf(S.variant) + d + KEYS.length) % KEYS.length]);
function showcase(k) {
  const repo = ISSUES.get(k).repo;
  if (isTracked(repo)) S.active = 'r:' + repo;
  S.pages = [newPage(k)]; S.focus = 'main'; render();
}
function openHelp() {
  closeHelp(false);
  S.modal = 'help';
  const rows = (h, rs, bold) => `<div class="h-sec">${h}</div>` + rs.map(([k, d]) => `<div class="h-k">${bold ? `<b>${esc(k)}</b>` : `<kbd>${esc(k)}</kbd>`}</div><div>${esc(d)}</div>`).join('');
  const page = [...PV().keys, ['Esc ⌫ [', 'Back one step (decided)'], ['o', 'Open the issue on GitHub'], ['Tab', 'Move focus between the sidebar and the main area (decided)']];
  const list = [['j k / ↑ ↓', 'Move'], ['← →', 'Collapse / expand'], ['e', 'Expand or collapse every tree'], ['↵ or click', 'Open the issue page']];
  const proto = [['⇧← ⇧→', 'Switch variant'], ['issue menu', 'Jump to a showcase issue'], ['`', 'Show / hide the state panel'], ['?', 'This help']];
  const bg = el(`<div class="modal-bg"><div class="modal help"><div class="m-head"><b>Issue page, variant ${S.variant}: ${esc(PV().name)}</b><span class="sp"></span><kbd>Esc</kbd></div><div class="help-body">${rows('What this variant decides', PV().stances, true)}${rows('Keys on the issue page', page)}${rows('Keys in the list (decided)', list)}${rows('Prototype only', proto)}</div></div></div>`);
  bg.onclick = e => { if (e.target === bg) closeHelp(); };
  document.body.append(bg);
}
function closeHelp(rerender = true) { document.querySelectorAll('.modal-bg').forEach(n => n.remove()); S.modal = null; if (rerender) render(); }
function toggleState() { const b = $('statebox'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; renderState(); }

// ---------- events ----------
const isDown = e => e.key === 'ArrowDown' || e.key === 'j';
const isUp = e => e.key === 'ArrowUp' || e.key === 'k';
const isRight = e => e.key === 'ArrowRight' || e.key === 'l';
const isLeft = e => e.key === 'ArrowLeft' || e.key === 'h';
function keyMain(e) {
  if (S.focus === 'sidebar') {
    const ord = sbOrder();
    if (isDown(e) || isUp(e)) { activate(ord[Math.max(0, Math.min(ord.length - 1, ord.indexOf(S.active) + (isDown(e) ? 1 : -1)))]); return true; }
    if (e.key === 'Enter' || isRight(e) || e.key === 'Escape') { S.focus = 'main'; render(); return true; }
    return false;
  }
  if (S.pages.length) {
    const P = PV();
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === '[') { popPage(); return true; }
    if (e.key === 'o') { gh(S.pages.at(-1).key); return true; }
    if (e.key === ' ') { pageScroll(e.shiftKey ? -1 : 1); return true; }
    if (e.key === 'Enter') { pageEnter(); return true; }
    if (P.nav === 'spatial') {
      if (isDown(e)) { pageSpatial(0, 1); return true; }
      if (isUp(e)) { pageSpatial(0, -1); return true; }
      if (isRight(e)) { pageSpatial(1, 0); return true; }
      if (isLeft(e)) { pageSpatial(-1, 0); return true; }
      return false;
    }
    if (isDown(e)) { pageMove(1); return true; }
    if (isUp(e)) { pageMove(-1); return true; }
    if (S.variant === 'A' && isRight(e)) { pageFold(true); return true; }
    if (S.variant === 'A' && isLeft(e)) { pageFold(false); return true; }
    return false;
  }
  if (isDown(e)) { moveSel(1); return true; }
  if (isUp(e)) { moveSel(-1); return true; }
  if (isRight(e)) { goRight(); return true; }
  if (isLeft(e)) { goLeft(); return true; }
  if (e.key === 'Enter') { enterRow(); return true; }
  if (e.key === 'e') { toggleAll(); return true; }
  if (e.key === 'o') { const r = curRows()[selIndex(curRows())]; if (r) gh(r.k); return true; }
  return false;
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cycle(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); return; }
  if (S.modal === 'help') { if (e.key === 'Escape' || e.key === '?') { closeHelp(); e.preventDefault(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { openHelp(); e.preventDefault(); return; }
  if (e.key === '`') { toggleState(); e.preventDefault(); return; }
  if (e.key === 'Tab') { S.focus = S.focus === 'main' ? 'sidebar' : 'main'; render(); e.preventDefault(); return; }
  if (keyMain(e)) e.preventDefault();
});
// clicked buttons must not keep focus, or Enter would both press them and act on the page
document.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const arg = t.dataset.arg, top = S.pages.at(-1);
  // remember where the click happened, so coming back restores the cursor there
  const nav = e.target.closest('[data-nav]');
  if (top && nav && $('scr').contains(nav)) top.cur = nav.dataset.nav;
  switch (t.dataset.act) {
    case 'entry': S.focus = 'sidebar'; activate(arg); break;
    case 'row': S.focus = 'main'; enterRow(arg); break;
    case 'toggle': toggleKey(arg); break;
    case 'ptoggle': top.exp.has(arg) ? top.exp.delete(arg) : top.exp.add(arg); render(); break;
    case 'full': top.full = true; top.mapScroll = undefined; render(); break;
    case 'open': openIssue(arg); break;
    case 'xlink': toast('Would open the link in the browser'); break;
    case 'gh': gh(arg); break;
    case 'tolist': toList(); break;
    case 'pop': popPage(); break;
    case 'help': openHelp(); break;
  }
});
$('sw-prev').onclick = () => cycle(-1);
$('sw-next').onclick = () => cycle(1);
$('sw-help').onclick = openHelp;
$('sw-state').onclick = toggleState;
const sel = $('sw-show');
sel.innerHTML = '<option value="">Jump to a showcase…</option>' + SHOWCASES.map(([k, d]) => `<option value="${esc(k)}">${esc(d)} (${esc(k)})</option>`).join('');
sel.onchange = () => { if (sel.value) showcase(sel.value); sel.value = ''; sel.blur(); };

const params = new URL(location.href).searchParams, initial = params.get('variant');
S.variant = KEYS.includes(initial) ? initial : 'B';
// prototype-only deep link: ?page=owner/repo#n (URL-encode the #), or ?page=none to start on the list
const startPage = params.get('page') ?? 'acme/api#122';
if (ISSUES.has(startPage)) { if (isTracked(ISSUES.get(startPage).repo)) S.active = 'r:' + ISSUES.get(startPage).repo; S.pages = [newPage(startPage)]; }
render();
toast(PV().blurb, 6500);
</script>
