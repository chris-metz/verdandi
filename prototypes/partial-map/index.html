<!doctype html>
<!--
  PROTOTYPE, throwaway. Do not build on this code.

  Question ("Adapt the blocking-map prototype to partial graph loading", issue #16 under "Map: Verdandi
  MVP spec"): how should the accepted blocking map behave when only part of the blocking graph has been
  fetched? The issue page loads the visible two steps each way and fetches farther only when the user
  explores ("Decide between live GitHub queries and a local mirror"); "More…" is allowed while the total
  is unknown, and "+N more" is exact only when the whole chain is known.

  Plan: the decided issue page (variant B of the issue-page prototype) inside the decided shell, with a
  simulated GitHub behind the map. Three structurally different maps, switchable via ?variant=A|B|C
  (bottom bar, or Shift+Left/Right). The "Simulated GitHub" panel slows loading down, delivers one
  response at a time, hits the rate limit, fails a request, changes GitHub under the page, and can follow
  closed issues on the "Blocks" side. The issue menu jumps to the showcases.

                        A  Live                        B  Pinned                      C  Settle
    placement           longest known route, redrawn   where a card first appeared;   longest known route, applied
                          as relationships arrive;       never moves; relationships     once loading stops; new
                          cards glide                    that run back arc over         cards wait at the bottom
    two steps           columns 1-2 by longest route;  the first two steps as         every loaded card, by
                          farther loaded cards fold      found; nothing folds           longest route; nothing folds
                          into the edge card
    branch states       a badge on each incomplete     a stub card per incomplete     one edge card per side
                          card                           branch                         listing everything open
    "More…"             the rest of the chain,         one more step of that branch   two more steps for the
                          progressively; pauses after    (m: of every branch on         whole side
                          40 issues                      that side)
    stopping            Stop on the edge card          nothing runs on its own        Stop on the edge card

  Common to all three, and up for review too: the cursor stays on its card while the map changes and this
  issue's card holds still on screen; closed issues are shown but not followed on either side; a cycle is
  a red dotted loop, drawn once the relationship that closes it has loaded.

  Synthetic data only; nothing is persisted. The shell, the list and the rest of the issue page are
  decided and not up for review here.

  Run: open this file in a browser. Optional URL parameters: ?variant=A|B|C, ?show=0..8 (a showcase),
  ?speed=instant|normal|slow|step.
-->

  stances: [
    ['Placement', 'Longest route, as in the accepted map, but applied only when this page has no requests left. While loading, new cards wait at the bottom of the column where they were found; then every card moves once, flashing amber if its column changed.'],
    ['Two steps', 'Every loaded card is shown; nothing folds.'],
    ['Branch states', 'One edge card per side sums up everything incomplete: relationships not loaded, failed, paused and invisible ones, and closed issues not followed. Dashed arrows lead into it from each open branch.'],

  if (box.style.display !== 'block') return;
  const top = S.pages.at(-1);
  if (!top) { box.textContent = 'Open an issue page to see what its map knows.'; return; }
  const In = mapInfo(top);
  const side = dir => {
    const i = In[dir], run = top.run[dir];
    return {
      issuesKnown: i.count, wholeChainKnown: i.complete,
      incomplete: i.B.map(b => `${b.key}: ${KIND[b.kind]}${b.kind === 'more' || b.kind === 'hid' || b.kind === 'nf' ? ` (${b.n})` : ''}`),
      cycles: i.G.edges.filter(e => e.cycle).map(e => `${e.a} -> ${e.b}`),
      moreRunning: run ? (run.capped ? `paused at ${CAP}` : 'yes') : 'no',
      ...(S.variant === 'A' ? { foldedBeyondTwoSteps: top.win[dir] !== Infinity } : {}),
    };
  };
  box.textContent = JSON.stringify({
    variant: `${S.variant} (${MV().name})`, page: top.key, 'blocked by (up)': side('up'), 'blocks (down)': side('down'),
    network: { speed: NET.speed, paused: NET.paused ? `until ${NET.until}` : false, running: NET.running.map(r => r.list), queued: NET.queue.map(r => r.list) },
    listsOpenedByThisPage: [...top.open],
  }, null, 2);
}
let toastTimer;
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, ms); }

// ---------- actions ----------
const topPage = () => S.pages.at(-1);
const leave = () => { const t = topPage(); if (t) dropQueued(t); };
function activate(id) { leave(); S.active = id; S.pages = []; render(); }
function openIssue(k) {
  if (topPage()?.key === k) { toast('Already on this issue\'s page'); return; }
  leave(); const pg = newPage(k); S.pages.push(pg); S.focus = 'main'; ensureLoaded(pg); render();
}
function popPage() { leave(); S.pages.pop(); const t = topPage(); if (t) ensureLoaded(t); render(); }
function toList() { leave(); S.pages = []; render(); }
function gh(k) { if (!k) return; const it = ISSUES.get(k); toast(`Would open https://github.com/${it.repo}/issues/${it.number} in the browser`); }
function toggleKey(k) { const ls = lstate(S.active); ls.expanded.has(k) ? ls.expanded.delete(k) : ls.expanded.add(k); render(); }
const curRows = () => LIST.rows(S.active).rows;
function moveSel(d) {
  const rows = curRows(), ls = lstate(S.active);
  if (!rows.length) return;
  ls.sel = rows[Math.max(0, Math.min(rows.length - 1, selIndex(rows) + d))].id; S.scrollSel = true; render();
}
function goRight() {
  const rows = curRows(), ls = lstate(S.active), i = selIndex(rows), r = rows[i];
  if (!r) return;
  if (r.kids && !r.exp) ls.expanded.add(r.k);
  else if (r.kids && rows[i + 1]) { ls.sel = rows[i + 1].id; S.scrollSel = true; }
  render();
}
function goLeft() {
  const rows = curRows(), ls = lstate(S.active), i = selIndex(rows), r = rows[i];
  if (!r) return;
  if (r.exp) ls.expanded.delete(r.k);
  else if (r.d > 0) for (let j = i - 1; j >= 0; j--) if (rows[j].d === r.d - 1) { ls.sel = rows[j].id; S.scrollSel = true; break; }
  render();
}
function enterRow(rid) {
  const rows = curRows(), ls = lstate(S.active);
  if (rid) ls.sel = rid;
  const r = rows[selIndex(rows)];
  if (r) openIssue(r.k);
}
function pageSpatial(dx, dy) {
  const top = topPage(), els = navEls(), cur = els.find(x => x.dataset.nav === top.cur);
  if (!cur) { if (els.length) { top.cur = els[0].dataset.nav; S.scrollLink = true; render(); } return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const x of els) {
    if (x === cur) continue;
    const b = x.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const p = dx ? (bx - ax) * dx : (by - ay) * dy;
    if (p <= 4) continue;
    const s = p + (dx ? Math.abs(by - ay) : Math.abs(bx - ax)) * 2.5;
    if (s < bs) { bs = s; best = x; }
  }
  if (best) { top.cur = best.dataset.nav; S.scrollLink = true; render(); }
}
function pageEnter() {
  const top = topPage(), cur = navEls().find(x => x.dataset.nav === top.cur);
  if (!cur) return;
  if (cur.dataset.act === 'open') openIssue(cur.dataset.arg);
  else if (cur.dataset.act) mapAct(top, cur.dataset.act, cur.dataset.arg);
  else toast('This issue\'s page is already open');
}
function pageScroll(d) { const m = $('scr'); m.scrollBy({ top: d * m.clientHeight * 0.8, behavior: 'smooth' }); }
function startRun(pg, dir, hops, cap) {
  const i = dirInfo(pg, dir), t = newTag(pg, dir, 'run');
  t.cap = cap ? i.count + cap : null;
  pg.run[dir] = t;
  for (const b of [...i.more, ...i.bad]) request(pg, dir, b.key, hops, t);
  tagCheck(t);
}
function stopRun(pg, dir) {
  const t = pg.run[dir];
  if (!t) return;
  t.stopped = true; t.capped = false; pg.run[dir] = null;
  dropQueued(pg, r => r.tag === t);
  toast('Stopped. What already arrived stays; requests on their way finish into the cache.');
}
function mapAct(pg, act, arg) {
  const dir = arg?.split(':')[0], key = arg?.includes(':') ? arg.slice(arg.indexOf(':') + 1) : null;
  switch (act) {
    case 'more':
      if (S.variant === 'A') { pg.win[dir] = Infinity; startRun(pg, dir, Infinity, CAP); } else startRun(pg, dir, 2, null);
      break;
    case 'cont': {
      const t = pg.run[dir], i = dirInfo(pg, dir);
      if (!t) break;
      t.capped = false; t.cap = countDir(pg, dir) + CAP;
      for (const b of [...i.more, ...i.bad]) request(pg, dir, b.key, Infinity, t);
      tagCheck(t);
      break;
    }
    case 'stop': stopRun(pg, dir); break;
    case 'unfold': pg.win[dir] = Infinity; break;
    case 'fold': pg.win[dir] = 2; break;
    case 'step': case 'retry': request(pg, dir, key, 1, null); break;
    case 'stepall': {
      const i = dirInfo(pg, dir);
      if (!i.more.length && !i.bad.length) { toast('Nothing more to load on this side'); break; }
      for (const b of [...i.more, ...i.bad]) request(pg, dir, b.key, 1, null);
      break;
    }
    case 'stopone': {
      const r = NET.queue.find(x => x.list === lid(dir, key));
      if (r) dropQueued(pg, x => x === r); else toast('Already on its way; it finishes into the cache');
      break;
    }
    case 'pinfo': toast(`GitHub's rate limit is used up. This loads on its own after ${NET.until}.`); break;
    case 'hinfo': toast('GitHub counts relationships to issues you cannot read, but does not list them: Verdandi can say how many, not which. (Assumed; not verified.)', 5500); break;
    case 'nfinfo': toast('A closed issue no longer blocks anything, so its own relationships are not followed.', 4000); break;
    case 'info': toast('Nothing to load here right now.'); break;
  }
  later();
}
function setVariant(v) {
  closeHelp(false);
  S.variant = v;
  for (const p of S.pages) { p.born.clear(); p.lastCol.clear(); p.movedAt.clear(); p.drawn = false; p.frozen = null; }
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render(); toast(MV().blurb, 6500);
}
const cycle = d => setVariant(KEYS[(KEYS.indexOf(S.variant) + d + KEYS.length) % KEYS.length]);
function showcase(sc) {
  if (S.changed) { // GitHub was changed: start over from the original data
    const u = new URL(location.href);
    u.searchParams.set('show', SHOWCASES.indexOf(sc)); u.searchParams.set('variant', S.variant); u.searchParams.set('speed', NET.speed);
    location.href = u; return;
  }
  resetNet();
  S.show = sc;
  const repo = ISSUES.get(sc.key).repo;
  if (isTracked(repo)) S.active = 'r:' + repo;
  const pg = newPage(sc.key);
  S.pages = [pg]; S.focus = 'main';
  sc.setup?.();
  ensureLoaded(pg); render();
}
function reopen() {
  const t = topPage();
  if (!t) { toast('Open an issue page first'); return; }
  resetNet();
  const pg = newPage(t.key);
  S.pages = [pg]; ensureLoaded(pg); render();
}
function openHelp() {
  closeHelp(false);
  S.modal = 'help';
  const rows = (h, rs, bold) => `<div class="h-sec">${h}</div>` + rs.map(([k, d]) => `<div class="h-k">${bold ? `<b>${esc(k)}</b>` : `<kbd>${esc(k)}</kbd>`}</div><div>${esc(d)}</div>`).join('');
  const common = [
    ['Focus', 'The cursor stays on its card while the map changes, and this issue\'s card holds still on screen. If the card under the cursor goes away (a stub that loaded, an edge card that finished), the cursor moves to the first card it revealed, else to the nearest card.'],
    ['Closed issues', 'Shown faded, with dashed arrows, and not followed on either side: a closed issue no longer blocks anything. The panel can follow them on the "Blocks" side instead.'],
    ['Cycles', 'A red dotted loop, drawn once the relationship that closes it has loaded; traversal stops there.'],
    ['Not visible', 'Assumed, not verified: GitHub counts relationships to issues you cannot read in the summary but leaves them out of the list.'],
    ['Refresh', 'r reads every loaded list again (decided); changes apply in place.'],
  ];
  const keys = [['← → ↑ ↓ / h j k l', 'Move across the page: ← toward blockers, → toward waiting issues'], ['↵ or click', 'Open the issue; on an edge card or stub, do what it says'], ['r', 'Refresh the page'], ...(S.variant === 'B' ? [['m', 'Next step for every open branch on the cursor\'s side']] : []), ['Esc ⌫', 'Back one page (decided)'], ['o', 'Open on GitHub']];
  const proto = [['⇧← ⇧→', 'Switch variant'], ['issue menu', 'Jump to a showcase (clears the cache)'], ['n', 'Deliver the next response, when the speed is "One at a time"'], ['`', 'Show what the map knows'], ['?', 'This help']];
  const bg = el(`<div class="modal-bg"><div class="modal help"><div class="m-head"><b>Blocking map, variant ${S.variant}: ${esc(MV().name)}</b><span class="sp"></span><kbd>Esc</kbd></div><div class="help-body">${rows('What this variant decides', MV().stances, true)}${rows('The same in every variant', common, true)}${rows('Keys on the issue page', keys)}${rows('Prototype only', proto)}</div></div></div>`);
  bg.onclick = e => { if (e.target === bg) closeHelp(); };
  document.body.append(bg);
}
function closeHelp(rerender = true) { document.querySelectorAll('.modal-bg').forEach(n => n.remove()); S.modal = null; if (rerender) render(); }
function toggleState() { const b = $('statebox'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; renderState(); }

// ---------- events ----------
const isDown = e => e.key === 'ArrowDown' || e.key === 'j';
const isUp = e => e.key === 'ArrowUp' || e.key === 'k';
const isRight = e => e.key === 'ArrowRight' || e.key === 'l';
const isLeft = e => e.key === 'ArrowLeft' || e.key === 'h';
function keyMain(e) {
  if (e.key === 'n' && NET.speed === 'step') { deliverNext(); return true; }
  if (S.focus === 'sidebar') {
    const ord = sbOrder();
    if (isDown(e) || isUp(e)) { activate(ord[Math.max(0, Math.min(ord.length - 1, ord.indexOf(S.active) + (isDown(e) ? 1 : -1)))]); return true; }
    if (e.key === 'Enter' || isRight(e) || e.key === 'Escape') { S.focus = 'main'; render(); return true; }
    return false;
  }
  const top = topPage();
  if (top) {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key === '[') { popPage(); return true; }
    if (e.key === 'o') { gh(top.key); return true; }
    if (e.key === 'r') { refresh(top); return true; }
    if (e.key === 'm' && S.variant === 'B') {
      const d = top.cur?.startsWith('up:') ? ['up'] : top.cur?.startsWith('down:') ? ['down'] : ['up', 'down'];
      d.forEach(x => mapAct(top, 'stepall', x));
      return true;
    }
    if (e.key === ' ') { pageScroll(e.shiftKey ? -1 : 1); return true; }
    if (e.key === 'Enter') { pageEnter(); return true; }
    if (isDown(e)) { pageSpatial(0, 1); return true; }
    if (isUp(e)) { pageSpatial(0, -1); return true; }
    if (isRight(e)) { pageSpatial(1, 0); return true; }
    if (isLeft(e)) { pageSpatial(-1, 0); return true; }
    return false;
  }
  if (isDown(e)) { moveSel(1); return true; }
  if (isUp(e)) { moveSel(-1); return true; }
  if (isRight(e)) { goRight(); return true; }
  if (isLeft(e)) { goLeft(); return true; }
  if (e.key === 'Enter') { enterRow(); return true; }
  if (e.key === 'o') { const r = curRows()[selIndex(curRows())]; if (r) gh(r.k); return true; }
  return false;
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cycle(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); return; }
  if (S.modal === 'help') { if (e.key === 'Escape' || e.key === '?') { closeHelp(); e.preventDefault(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { openHelp(); e.preventDefault(); return; }
  if (e.key === '`') { toggleState(); e.preventDefault(); return; }
  if (e.key === 'Tab') { S.focus = S.focus === 'main' ? 'sidebar' : 'main'; render(); e.preventDefault(); return; }
  if (keyMain(e)) e.preventDefault();
});
// The map redraws whenever a response arrives, which can replace an element between mousedown and
// click; act on pointerdown so no click is lost.
document.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const t = e.target.closest('[data-act]');
  if (!t || t.closest('#switcher')) return;
  if (t.tagName === 'BUTTON' || t.closest('#net')) e.preventDefault(); // buttons must not keep focus, or Enter would press them again
  const arg = t.dataset.arg, top = topPage();
  const nav = e.target.closest('[data-nav]');
  if (top && nav && $('scr')?.contains(nav)) top.cur = nav.dataset.nav; // coming back restores the cursor there
  switch (t.dataset.act) {
    case 'entry': S.focus = 'sidebar'; activate(arg); break;
    case 'row': S.focus = 'main'; enterRow(arg); break;
    case 'toggle': toggleKey(arg); break;
    case 'ptoggle': top.sx.has(arg) ? top.sx.delete(arg) : top.sx.add(arg); render(); break;
    case 'open': openIssue(arg); break;
    case 'xlink': toast('Would open the link in the browser'); break;
    case 'gh': gh(arg); break;
    case 'tolist': toList(); break;
    case 'pop': popPage(); break;
    case 'help': openHelp(); break;
    case 'netfold': S.netOpen = !S.netOpen; render(); break;
    case 'deliver': deliverNext(); break;
    case 'limit': NET.paused ? resume() : hitLimit(); break;
    case 'failnext': NET.failNext = NET.failNext ? 0 : 1; render(); break;
    case 'change': { const msg = S.show?.change?.(); if (msg) S.changed = true; if (msg) toast(`On GitHub: ${msg} The page shows it after a refresh (r).`, 6000); render(); break; }
    case 'reload': reopen(); break;
    default: if (top) mapAct(top, t.dataset.act, arg);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'net-speed') { setSpeed(e.target.value); e.target.blur(); }
  if (e.target.id === 'net-follow') { S.followClosed = e.target.checked; e.target.blur(); const t = topPage(); if (t) ensureLoaded(t); render(); }
});
$('sw-prev').onclick = () => cycle(-1);
$('sw-next').onclick = () => cycle(1);
$('sw-help').onclick = openHelp;
$('sw-state').onclick = toggleState;
const sel = $('sw-show');
sel.innerHTML = '<option value="">Jump to a showcase…</option>' + SHOWCASES.map((s, i) => `<option value="${i}">${esc(s.name)} (${esc(s.key)})</option>`).join('');
sel.onchange = () => { if (sel.value !== '') showcase(SHOWCASES[+sel.value]); sel.value = ''; sel.blur(); };

const params = new URL(location.href).searchParams, initial = params.get('variant');
S.variant = KEYS.includes(initial) ? initial : 'A';
if (params.get('speed') in LAT || params.get('speed') === 'step') NET.speed = params.get('speed');
// prototype-only deep link: ?show=0..8 picks a showcase
showcase(SHOWCASES[+(params.get('show') ?? 0)] ?? SHOWCASES[0]);
toast(MV().blurb, 6500);
</script>
