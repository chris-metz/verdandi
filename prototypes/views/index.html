<!doctype html>
<!--
  PROTOTYPE, throwaway. Do not build on this code.

  Question ("Prototype saved-search views and their filtered issue trees", issue #17 under "Map: Verdandi
  MVP spec"): how do users create, edit, remove and browse views (named, saved GitHub issue searches whose
  scope is their search text alone), and how does a view's issue tree show matches, context issues,
  closed issues and incomplete results?

  Plan: the decided shell and outline list, with a simulated GitHub behind the views. Three structurally
  different takes, switchable via ?variant=A|B|C (bottom bar, or Shift+Left/Right):

                        A  Dialog                      B  Query bar                   C  Editor page
    create / edit       modal dialog: name, search,    the search is an editable bar  an editor page replaces the
                          examples; Save runs the        above the tree; Enter runs     list: name, search, example
                          search, stays open on          it, Save keeps it; inline      gallery, preview of the
                          GitHub's error                 rename in the sidebar          first matches
    remove              confirmed                      immediately, with Undo         confirmed
    starter views       none; "New view..." entry      three, written on first run    none; example gallery
    sidebar entry       name + last match count        name only                      name + search text + count
    tree                every ancestor, with all its   only the paths to matches;     matches grouped under one
                          sub-issues as context          other sub-issues folded        dimmed path header per
                                                         into "N other sub-issues"      parent issue
    match vs context    context dimmed; closed         a dot marks a match; context   context rows faint and
                          matches not dimmed in a        dimmed; closed dimmed as       italic, no columns; closed
                          view                           everywhere                     dimmed as everywhere
    unknown status      dimmed + "?"                   dashed ring instead of dot     "match?" tag

  Common to all three, and up for review too: roots ordered by the search rank of their first match
  (GitHub's order: newest-created first unless the search has sort:); paths to matches start expanded,
  matches without a matching sub-issue start collapsed; an issue appears once; the header, strips and
  body states follow "Decide refresh, partial loading and rate-limit recovery".

  Verdict: A (Dialog) wins, as prototyped, with the common behaviour above. B and C stay here for
  reference.

  Synthetic data only; nothing is persisted. GitHub's error messages are simulated. The shell, the
  outline rows and the issue page are decided and not up for review here.

  Run: open this file in a browser. URL parameters: ?variant=A|B|C, ?view=v1..v4, ?speed=instant|normal|slow.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdandi views prototype</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --fg: #1f2328; --fg2: #59636e; --fg3: #818b98;
  --line: #d1d9e0; --accent: #0969da; --accent-bg: #ddf4ff; --sel: #e6eefb; --open: #1a7f37;
  --closed: #8250df; --blocked: #cf222e; --blocked-bg: #ffebe9; --warn: #9a6700; --warn-bg: #fff8c5;
  --scrim: rgba(31, 35, 40, .28); --shadow: 0 8px 28px rgba(66, 74, 83, .28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --fg: #e6edf3; --fg2: #9198a1; --fg3: #6e7681;
    --line: #30363d; --accent: #4493f8; --accent-bg: #132a47; --sel: #1a2638; --open: #3fb950;
    --closed: #ab7df8; --blocked: #f85149; --blocked-bg: rgba(248, 81, 73, .13); --warn: #d29922; --warn-bg: rgba(187, 128, 9, .15);
    --scrim: rgba(1, 4, 9, .55); --shadow: 0 8px 28px rgba(1, 4, 9, .85);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, sans-serif;
  background: var(--bg); color: var(--fg); overflow: hidden; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
kbd {
  font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 0 5px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--fg2); white-space: nowrap;
}
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: 12px; background: var(--bg3); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--fg3); font-weight: 400; }
.sp { flex: 1; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- shell (decided: app-shell prototype, variant A) ---------- */
#app { display: grid; grid-template-columns: auto minmax(0, 1fr); height: 100vh; }
.sidebar { width: 256px; background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sidebar.focused { box-shadow: inset 0 2px 0 var(--accent); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.main.focused .mainbar { box-shadow: inset 0 2px 0 var(--accent); }
.brand { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; font-weight: 600; white-space: nowrap; }
.logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #8250df, #0969da); flex: none; }
.sb-scroll { flex: 1; overflow: auto; padding: 2px 8px 16px; }
.sb-foot { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--fg3); font-size: 11px; line-height: 1.8; }
.iconbtn { border: 0; background: none; color: var(--fg2); width: 22px; height: 22px; border-radius: 5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.iconbtn:hover { background: var(--bg3); color: var(--fg); }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px 4px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); }
.entry { display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 30px; border-radius: 6px; cursor: default; user-select: none; white-space: nowrap; }
.entry.tall { min-height: 40px; }
.entry:hover { background: var(--bg3); }
.entry.active { background: var(--sel); font-weight: 600; }
.sidebar.focused .entry.active { background: var(--accent-bg); outline: 1px solid var(--accent); outline-offset: -1px; }
.entry .ic { color: var(--fg2); }
.entry.active .ic { color: var(--accent); }
.entry .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.entry .count { color: var(--fg3); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.entry .warn { color: var(--blocked); display: inline-flex; }
.entry .warn .ic { color: var(--blocked); width: 14px; height: 14px; }
.entry .dotmod { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.entry.draft .name { font-style: italic; }
.entry.newview { color: var(--fg3); cursor: pointer; }
.entry.newview .ic { color: var(--fg3); }
.name2 { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.name2 .n1, .name2 .n2 { overflow: hidden; text-overflow: ellipsis; }
.name2 .n2 { font-size: 11px; color: var(--fg3); font-weight: 400; }
.name2 .qline { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
.ren { flex: 1; min-width: 0; font-weight: 400; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 5px; background: var(--bg); color: var(--fg); outline: none; }
.owner { color: var(--fg3); font-weight: 400; }
.mainbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; white-space: nowrap; }
.mainbar h2 { font-size: 14px; margin: 0; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; flex: none; max-width: 40%; }
.mainbar .sub { color: var(--fg3); white-space: nowrap; }
.mainbar .draft-tag { font-size: 11px; font-weight: 400; color: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 0 6px; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.btn { border: 1px solid var(--line); background: var(--bg2); border-radius: 6px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 28px; }
.btn:hover { background: var(--bg3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg2); }
.btn.primary { background: var(--open); border-color: var(--open); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary kbd { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .5); }
.btn.danger { color: var(--blocked); }
.btn.danger.solid { background: var(--blocked); border-color: var(--blocked); color: #fff; }
.btn.danger.solid kbd { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .5); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }
.sep { color: var(--line); }
.qchip { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; color: var(--fg2); cursor: pointer; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.qchip:hover { border-color: var(--accent); color: var(--fg); }
.status { color: var(--fg3); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status .ic { width: 14px; height: 14px; }

/* ---------- strips and body states (policy: "Decide refresh, partial loading and rate-limit recovery") ---------- */
.strip { display: flex; align-items: center; gap: 8px; padding: 5px 16px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--warn-bg); flex: none; white-space: nowrap; overflow: hidden; }
.strip > .ic { color: var(--warn); width: 14px; height: 14px; }
.strip.red { background: var(--blocked-bg); } .strip.red > .ic { color: var(--blocked); }
.strip.info { background: var(--bg2); } .strip.info > .ic { color: var(--fg2); }
.strip .hintx { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; }
.bstate { max-width: 580px; margin: 56px auto; padding: 0 24px; text-align: center; color: var(--fg2); }
.bstate h3 { color: var(--fg); font-size: 15px; margin: 10px 0 6px; }
.bstate .big { width: 28px; height: 28px; color: var(--fg3); stroke-width: 1.2; }
.bstate pre { text-align: left; white-space: pre-wrap; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--fg); }
.bstate .acts { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.bstate ul { text-align: left; margin: 12px auto; padding-left: 18px; line-height: 1.6; }

/* ---------- outline rows (decided: issue-list prototype, variant A) ---------- */
.chev { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg3); border-radius: 4px; flex: none; }
.chev[data-act]:hover { background: var(--bg3); color: var(--fg); }
.chev .ic { width: 12px; height: 12px; stroke-width: 1.8; }
.num { color: var(--fg3); font-variant-numeric: tabular-nums; flex: none; }
.st { display: inline-flex; flex: none; }
.st-open { color: var(--open); } .st-closed { color: var(--closed); } .st-blocked { color: var(--blocked); } .st-ghost { color: var(--fg3); }
.title { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; white-space: nowrap; }
.closed > .title { color: var(--fg2); }
.ext { font-size: 10px; border: 1px dashed var(--fg3); border-radius: 10px; padding: 0 6px; color: var(--fg2); flex: none; line-height: 16px; }
.list-foot { padding: 14px 16px; color: var(--fg3); font-size: 12px; }
.row-sel { background: var(--sel) !important; box-shadow: inset 2px 0 0 var(--accent); }
.main:not(.focused) .row-sel { background: var(--bg3) !important; box-shadow: none; }
.arow { scroll-margin: 44px 0 90px; }
.alist { padding-bottom: 110px; }
.colhead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 16px 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--fg3); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.colhead .c-title { flex: 1; }
.arow { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 16px 0 12px; cursor: pointer; white-space: nowrap; }
.arow:hover { background: var(--bg2); }
.guides { flex: none; align-self: stretch; width: calc(var(--d) * 20px); margin-right: -6px; background-image: repeating-linear-gradient(to right, transparent 0 8px, var(--line) 8px 9px, transparent 9px 20px); }
.col-prog { width: 92px; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.col-bb, .col-bl { width: 76px; flex: none; display: inline-flex; }
.bar { width: 44px; height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; background: var(--closed); }
.frac { font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.cnt { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px 0 5px; border-radius: 10px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cnt .ic { width: 13px; height: 13px; }
.cnt.red { background: var(--blocked-bg); color: var(--blocked); }
.cnt.amber { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.cnt.mute { color: var(--fg3); font-weight: 400; }
.rchip { font-size: 11px; padding: 0 6px; border-radius: 4px; color: #fff; background: hsl(var(--h) 42% 44%); flex: none; line-height: 17px; }
.rchip.x { background: none; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--fg3); }
.lbl { font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 2em; flex: none; white-space: nowrap; }
.lbl.more { background: var(--bg3); color: var(--fg2); }
.pchip { font-size: 11px; color: var(--fg2); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px 0 4px; flex: none; line-height: 17px; display: inline-flex; gap: 3px; align-items: center; }
.pchip .ic { width: 12px; height: 12px; }
.pchip:hover { border-color: var(--accent); color: var(--accent); }
.pchip.load { border-style: dashed; }
.pchip .spin { width: 9px; height: 9px; border-width: 1.5px; }

/* ---------- view rows: what differs per variant ---------- */
.arow.ctx > :not(.guides):not(.chev) { opacity: .42; }
.arow.ctx.row-sel > :not(.guides):not(.chev) { opacity: .75; }
.vA .arow.closed.match > .title { color: var(--fg); }
.gut { width: 10px; flex: none; display: inline-flex; justify-content: center; align-items: center; margin: 0 -2px; }
.gut i { display: block; border-radius: 50%; }
.gut .dot { width: 7px; height: 7px; background: var(--accent); }
.gut .ring { width: 8px; height: 8px; border: 1.5px dashed var(--fg2); }
.arow.faint .title { font-style: italic; color: var(--fg3); }
.arow.faint > .st, .arow.faint > .rchip, .arow.faint > .num { opacity: .55; }
.unk { font-size: 10px; border: 1px dashed var(--fg2); border-radius: 8px; padding: 0 5px; color: var(--fg2); flex: none; line-height: 15px; }
.inside { font-size: 11px; color: var(--accent); flex: none; white-space: nowrap; }
.inside.dotn { display: inline-flex; align-items: center; gap: 3px; }
.inside.dotn i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
.fold .title { color: var(--fg3); }
.unavail .title { color: var(--fg2); }
.unavail.failed .title { color: var(--blocked); }
.crumbs { display: inline-flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; flex: 0 1 auto; }
.crumb { display: inline-flex; align-items: center; gap: 4px; padding: 0 5px; border-radius: 4px; white-space: nowrap; color: var(--fg3); min-width: 0; }
.crumb:hover { background: var(--bg3); color: var(--fg); }
.crumb .st { opacity: .55; }
.crumb .ic { width: 14px; height: 14px; }
.crumb.bad { color: var(--blocked); }
.csep { color: var(--fg3); flex: none; }
.pmore { color: var(--fg3); font-size: 12px; flex: none; }
.loadrow { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 16px 0 36px; color: var(--fg3); font-size: 12px; }

/* ---------- context menu, confirm, help ---------- */
.menu { position: fixed; z-index: 60; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.menu .mi { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.menu .mi:hover { background: var(--sel); }
.menu .mi kbd { margin-left: auto; }
.menu .mi.danger { color: var(--blocked); }
.modal-bg { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal-bg.top { align-items: flex-start; padding-top: 9vh; }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 86vh; overflow: hidden; }
.m-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.m-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); min-height: 50px; }
.cf { width: 460px; max-width: calc(100vw - 32px); }
.cf-body { padding: 14px 16px; color: var(--fg2); }
.help { width: 760px; max-width: calc(100vw - 32px); }
.help-body { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; padding: 14px 16px; overflow: auto; }
.help-body .h-k { text-align: right; }
.help-body .h-sec { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }

/* ---------- shared editor bits ---------- */
.fl { font-weight: 600; font-size: 12px; margin-top: 8px; }
.tin { font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); outline: none; width: 100%; }
.tin:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.tin.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.scope { font-size: 12px; color: var(--fg2); display: flex; gap: 6px; align-items: flex-start; line-height: 1.5; }
.scope .ic { width: 14px; height: 14px; margin-top: 2px; }
.scope.warn { color: var(--warn); }
.ederr { font-size: 12px; color: var(--blocked); background: var(--blocked-bg); border-radius: 6px; padding: 7px 10px; }
.ederr pre { margin: 4px 0 0; white-space: pre-wrap; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--fg); }
.ederr .acts { margin-top: 6px; display: flex; gap: 8px; }
.exh { margin-top: 12px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); display: flex; gap: 8px; align-items: center; }
.exh .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }

/* ---------- A: dialog ---------- */
.ed-a { width: 680px; max-width: calc(100vw - 32px); }
.ed-body { padding: 8px 16px 16px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.exl { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ex { display: grid; grid-template-columns: minmax(0, 330px) 1fr; gap: 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); padding: 6px 10px; cursor: pointer; align-items: center; }
.ex:last-child { border-bottom: 0; }
.ex:hover, .ex:focus { background: var(--sel); outline: none; }
.ex code { background: none; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex span { color: var(--fg2); font-size: 12px; }

/* ---------- B: query bar ---------- */
.qbar { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex: none; }
.qwrap { flex: 1; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--bg); min-width: 0; }
.qwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.qwrap .ic { color: var(--fg3); }
.qwrap input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--fg); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 6px 0; }
.qstate { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg3); white-space: nowrap; }
.qstate .mod { color: var(--warn); font-weight: 600; }
.qdd { position: absolute; left: 16px; right: 16px; top: calc(100% - 6px); z-index: 20; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: none; }
.qdd.on { display: block; }
.qdd .ddh { padding: 4px 8px; font-size: 11px; color: var(--fg3); }
.qdd .ddi { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 12px; padding: 5px 8px; border-radius: 5px; cursor: pointer; align-items: center; }
.qdd .ddi.hi, .qdd .ddi:hover { background: var(--sel); }
.qdd .ddi code { background: none; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qdd .ddi span { color: var(--fg2); font-size: 12px; }

/* ---------- C: editor page ---------- */

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const pick = (a, r) => a[Math.floor(r() * a.length)];

}

});
// clicked buttons must not keep focus, or Enter would both press them and act on the list
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#menu')) closeMenu();
  if (e.target.closest('button') || e.target.closest('.ddi')) e.preventDefault();
});
let lastClick = { id: null, t: 0 };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const arg = t.dataset.arg;
  switch (t.dataset.act) {
    case 'entry': {
      const dbl = lastClick.id === arg && Date.now() - lastClick.t < 400;
      lastClick = { id: arg, t: Date.now() };
      if (S.renaming && S.renaming !== arg) commitRename(false);
      if (dbl && isView(arg)) { S.variant === 'B' ? startRename(arg) : editView(arg); break; }
      S.focus = 'sidebar'; if (S.active !== arg || S.pages.length || S.edit) activate(arg); else render();
      break;
    }
    case 'newview': newView(); break;
    case 'row': S.focus = 'main'; if (e.target.closest('[data-act="retryparent"]')) break; enterRow(arg); break;
    case 'toggle': e.stopPropagation(); toggleRow(arg); break;
    case 'open': openIssue(arg); break;
    case 'gh': gh(arg); break;
    case 'tolist': toList(); break;
    case 'pop': popPage(); break;
    case 'help': openHelp(); break;
    case 'edit': editView(S.active); break;
    case 'refresh': refresh(); break;
    case 'retry': { const run = RUNS.get(S.active); if (run) startRun(S.active, run.q); break; }
    case 'retryparent': retryParent(S.active, arg); break;
    case 'retryall': RUNS.get(S.active)?.data?.failed.forEach(pk => retryParent(S.active, pk)); break;
    case 'exA': { const x = EXAMPLES[+arg], E = S.editor; E.query = x.q; $('edA-q').value = x.q; if (!E.name.trim() || E.name === E.exName) { E.name = x.name; E.exName = x.name; $('edA-name').value = x.name; } E.err = null; updateEditorA(); $('edA-q').focus(); break; }
    case 'ed-save': saveA(); break;
    case 'ed-force': saveA(true); break;
    case 'ed-cancel': closeEditorA(); break;
    case 'ed-remove': S.editor.confirm = true; updateEditorA(); break;
    case 'ed-keep': S.editor.confirm = false; updateEditorA(); break;
    case 'ed-yes': { const vid = S.editor.vid; closeEditorA(); removeView(vid, false); break; }
    case 'qb-save': saveB(S.active); break;
    case 'qb-revert': revertB(S.active); break;
    case 'ddB': useExampleB(S.active, +arg); break;
    case 'cf-yes': doConfirm(); break;
    case 'cf-no': closeConfirm(); break;
    case 'mi-edit': closeMenu(); if (S.variant === 'B') { activate(arg); focusQbar(); } else editView(arg); break;
    case 'mi-rename': closeMenu(); startRename(arg); break;
    case 'mi-remove': closeMenu(); askRemove(arg); break;
    case 'undo': doUndo(); break;
    case 'edc-save': saveC(); break;
    case 'edc-cancel': cancelC(); break;
    case 'edc-preview': previewC(); break;
    case 'exC': useExampleC(+arg); break;
    case 'edc-remove': S.edit.confirm = true; renderMain(); break;
    case 'edc-keep': S.edit.confirm = false; renderMain(); break;
    case 'edc-yes': { const vid = S.edit.vid; S.edit = null; removeView(vid, false); break; }
    case 'sim-fold': SIM.folded = !SIM.folded; renderSim(); break;
    case 'sim-speed': SIM.speed = arg; renderSim(); break;
    case 'sim-nomatch': { const k = selectedKey(); if (!k) break; SIM.nomatch.has(k) ? SIM.nomatch.delete(k) : SIM.nomatch.add(k); log(`${k} ${SIM.nomatch.has(k) ? 'stopped matching' : 'matches again'}`); toast('Changed on GitHub. The view updates on the next refresh (r)'); renderSim(); break; }
    case 'sim-limit': refill(); SIM.pool = 0; log('search limit used up'); toast(`Search limit used up; it resets at ${hhmm(SIM.resetAt)}. Refresh a view to see the pause.`); renderSim(); break;
    case 'sim-age': RUNS.forEach(r => { if (r.at) r.at -= 6 * 60000; }); toast('All data is now 6+ minutes old: opening a view or focusing the window revalidates it'); render(); break;
    case 'sim-first': {
      RUNS.forEach(r => { r.cancelled = true; }); RUNS.clear(); S.lists = {}; S.drafts = {}; S.pages = []; S.edit = null;
      S.views = S.variant === 'B' ? STARTERS.map((s, i) => ({ id: 's' + (i + 1), ...s })) : [];
      toast(S.variant === 'B' ? 'Fresh settings file: three starter views were written' : 'Fresh settings file: no views yet');
      activate(S.views[0]?.id ?? 'all');
      break;
    }
    case 'sim-reset': location.reload(); break;
  }
});
document.addEventListener('contextmenu', e => {
  const t = e.target.closest('[data-view]');
  if (!t) return;
  e.preventDefault();
  if (S.active !== t.dataset.view) activate(t.dataset.view);
  openMenu(t.dataset.view, e.clientX, e.clientY);
});
$('net').addEventListener('change', e => {
  if (e.target.id === 'sim-scen') { SIM.scenario = e.target.value; e.target.blur(); toast(SIM.scenario === 'normal' ? 'GitHub answers normally again' : `The next searches: ${SCEN.find(s => s[0] === SIM.scenario)[1]}. Refresh (r) to run one.`); renderSim(); }
  else if (e.target.id === 'sim-fp') { SIM.failParent = e.target.checked; toast(SIM.failParent ? 'The next run cannot load one parent issue. Refresh (r).' : 'Parent issues load again'); }
  else if (e.target.dataset.trk) {
    const r = e.target.dataset.trk;
    S.tracked = e.target.checked ? [...S.tracked, r] : S.tracked.filter(x => x !== r);
    toast(`${e.target.checked ? 'Tracking' : 'No longer tracking'} ${r}. Views keep their searches and results; only the repository chips change.`, 4000);
    if (S.active === 'r:' + r) activate('all'); else render();
  }
});
window.addEventListener('focus', () => { if (isView(S.active) && !S.pages.length && !S.edit) ensureRun(S.active); });
setInterval(() => { refill(); renderSim(); if (isView(S.active) && !S.pages.length && !S.edit && !S.qbFocus) { const mb = $('mb'); if (mb) mb.innerHTML = mainbarHTML(S.active); } }, 15000);
$('sw-prev').onclick = () => cycle(-1);
$('sw-next').onclick = () => cycle(1);
$('sw-help').onclick = openHelp;
$('sw-state').onclick = toggleState;

const params = new URL(location.href).searchParams;
S.variant = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';
if (SPEED[params.get('speed')] !== undefined) SIM.speed = params.get('speed');
const startView = params.get('view');
activate(startView && sbOrder().includes(startView) ? startView : 'v1');
toast(VARIANTS[S.variant].blurb, 6000);
</script>
</body>
</html>
