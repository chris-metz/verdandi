<!doctype html>
<!--
  PROTOTYPE, throwaway. Do not build on this code.

  Question ("Prototype the two-column app shell and sidebar", issue #2 under "Map: Verdandi MVP spec"):
  how should Verdandi's two-column shell look and behave?

  Plan: three structurally different shells, switchable via ?variant=A|B|C (floating bar at the
  bottom, or Shift+Left/Right). They differ in sidebar grouping, the add-repository flow, how the
  issue page replaces the list and how you get back, and how keyboard focus moves between panes.
  The issue list and issue page themselves are deliberately plain: they belong to the sibling
  prototypes. Synthetic data only; nothing is persisted.

  Run: open this file in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdandi app shell prototype</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --fg: #1f2328; --fg2: #59636e; --fg3: #818b98;
  --line: #d1d9e0; --accent: #0969da; --accent-bg: #ddf4ff; --sel: #e6eefb; --open: #1a7f37;
  --closed: #8250df; --blocked: #cf222e; --scrim: rgba(31, 35, 40, .28);
  --shadow: 0 8px 28px rgba(66, 74, 83, .28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --fg: #e6edf3; --fg2: #9198a1; --fg3: #6e7681;
    --line: #30363d; --accent: #4493f8; --accent-bg: #132a47; --sel: #1a2638; --open: #3fb950;
    --closed: #ab7df8; --blocked: #f85149; --scrim: rgba(1, 4, 9, .55);
    --shadow: 0 8px 28px rgba(1, 4, 9, .85);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, sans-serif;
  background: var(--bg); color: var(--fg); overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg3); padding: 0 4px; border-radius: 4px; }
kbd {
  font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 0 5px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--fg2); white-space: nowrap;
}
.muted { color: var(--fg3); font-weight: 400; }
.sp { flex: 1; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
#app { display: grid; grid-template-columns: auto minmax(0, 1fr); height: 100vh; }
.sidebar {
  width: 256px; background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  min-height: 0; overflow: hidden; transition: width .18s ease;
}
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.brand { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; font-weight: 600; white-space: nowrap; }
.logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #8250df, #0969da); flex: none; }
.sb-scroll { flex: 1; overflow: auto; padding: 2px 8px 16px; }
.sb-foot { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--fg3); font-size: 11px; line-height: 1.8; }
.iconbtn { border: 0; background: none; color: var(--fg2); width: 22px; height: 22px; border-radius: 5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.iconbtn:hover { background: var(--bg3); color: var(--fg); }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }

.entry {
  display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 30px; border-radius: 6px; cursor: default;
  user-select: none; position: relative; white-space: nowrap;
}
.entry:hover { background: var(--bg3); }
.entry.active { background: var(--sel); font-weight: 600; }
.entry .ic { color: var(--fg2); }
.entry.active .ic { color: var(--accent); }
.entry .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.entry .count { color: var(--fg3); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.entry .sc { display: none; }
body.show-sc .entry .sc { display: inline-block; }
body.show-sc .entry .count { display: none; }
.entry.dragging { opacity: .4; }
.entry.drop-before::before, .entry.drop-after::after {
  content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px;
}
.entry.drop-before::before { top: -1px; }
.entry.drop-after::after { bottom: -1px; }
.owner { color: var(--fg3); font-weight: 400; }

.mainbar {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line);
  flex: none; min-width: 0; white-space: nowrap;
}
.mainbar h2 { font-size: 14px; margin: 0; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.mainbar .sub { color: var(--fg3); }
.hint { color: var(--fg3); font-size: 12px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.btn {
  border: 1px solid var(--line); background: var(--bg2); border-radius: 6px; padding: 3px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 28px;
}
.btn:hover { background: var(--bg3); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg2); }
.btn.primary { background: #1f883d; border-color: #1f883d; color: #fff; }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- issue list (deliberately plain; its presentation is another prototype's question) ---------- */
.list { padding: 6px 0 90px; }
.row {
  display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 16px 0 calc(8px + var(--d, 0) * 22px);
  cursor: pointer; white-space: nowrap;
}
.row:hover { background: var(--bg2); }
.row.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.chev { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg3); border-radius: 4px; flex: none; }
.chev[data-act]:hover { background: var(--bg3); color: var(--fg); }
.chev .ic { width: 12px; height: 12px; stroke-width: 1.8; }
.num { color: var(--fg3); font-variant-numeric: tabular-nums; flex: none; }
.row .title { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.closed .title { color: var(--fg2); }
.row .meta { margin-left: auto; display: flex; gap: 10px; color: var(--fg3); font-size: 12px; flex: none; padding-left: 12px; }
.st { display: inline-flex; flex: none; }
.st-open { color: var(--open); } .st-closed { color: var(--closed); }
.blk { color: var(--blocked); display: inline-flex; align-items: center; gap: 3px; }
.blk .ic { width: 13px; height: 13px; }
.ext { font-size: 10px; border: 1px dashed var(--fg3); border-radius: 10px; padding: 0 6px; color: var(--fg2); flex: none; }
.empty { padding: 40px; color: var(--fg3); text-align: center; }

/* ---------- issue page (deliberately plain; its presentation is another prototype's question) ---------- */
.issue { max-width: 1060px; padding: 20px 28px 110px; }
.i-ref { display: flex; align-items: center; gap: 6px; color: var(--fg2); }
.issue h1 { font-size: 22px; font-weight: 600; margin: 6px 0 10px; line-height: 1.3; }
.i-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--fg2); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 8px; border-radius: 999px; color: #fff; font-weight: 500; }
.pill.open { background: var(--open); } .pill.closed { background: var(--closed); }
.label { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.i-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; margin-top: 16px; }
@media (max-width: 1100px) { .i-grid { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }
.i-body p { margin: 0 0 10px; }
.comment { border: 1px solid var(--line); border-radius: 6px; margin-top: 14px; }
.comment .ch { background: var(--bg2); padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--fg2); border-radius: 6px 6px 0 0; }
.comment .cbody { padding: 10px 12px; }
.side section { padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.side h4 { font-size: 12px; color: var(--fg2); margin: 0 0 4px; font-weight: 600; }
.lnk { display: flex; align-items: center; gap: 6px; padding: 3px 6px; margin: 0 -6px; border-radius: 5px; cursor: pointer; white-space: nowrap; min-width: 0; }
.lnk:hover { background: var(--bg2); }
.lnk.cur { background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
.lnk .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.none { color: var(--fg3); }

/* ---------- variant A: sections, page swap, Tab focus ---------- */
.vA .entry.tall { min-height: 40px; }
.vA .name2 { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.vA .name2 .n1, .vA .name2 .n2 { overflow: hidden; text-overflow: ellipsis; }
.vA .name2 .n2 { font-size: 11px; color: var(--fg3); font-weight: 400; }
.vA .sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px 4px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); }
.vA .sidebar.focused { box-shadow: inset 0 2px 0 var(--accent); }
.vA .sidebar.focused .entry.active { background: var(--accent-bg); outline: 1px solid var(--accent); outline-offset: -1px; }
.vA .main.focused > .mainbar { box-shadow: inset 0 2px 0 var(--accent); }
.vA .main:not(.focused) .row.sel { background: var(--bg3); box-shadow: none; }
.vA .sep { color: var(--line); }

/* ---------- variant B: mixed list, sheets ---------- */
.vB .sidebar { width: 248px; }
.vB .numb { width: 12px; color: var(--fg3); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 400; flex: none; }
.vB .addbar {
  margin: 0 8px 8px; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg2); cursor: pointer; text-align: left;
}
.vB .addbar:hover { border-color: var(--fg3); }
.vB .addbar span { flex: 1; }
.sheets { position: absolute; inset: 0; z-index: 5; }
.scrim { position: absolute; inset: 0; background: var(--scrim); cursor: pointer; }
.sheet {
  position: absolute; top: 0; bottom: 0; right: 0; left: calc(72px + var(--i) * 18px); background: var(--bg);
  border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0, 0, 0, .18); display: flex; flex-direction: column;
}
.sheet.enter { animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(35%); opacity: .2; } to { transform: none; opacity: 1; } }
.sheet.under { cursor: pointer; background: var(--bg2); }
.sheet.under > * { pointer-events: none; }
.depth { color: var(--fg3); font-size: 12px; }

/* ---------- variant C: owner groups, rail, breadcrumbs ---------- */
.vC .sidebar { width: 240px; }
.vC.rail .sidebar { width: 58px; }
.vC .grp-h { display: flex; align-items: center; gap: 8px; padding: 14px 8px 4px; color: var(--fg2); font-weight: 600; font-size: 12px; }
.vC .entry.ind { padding-left: 34px; }
.vC .entry.ind .ic { display: none; }
.vC .sidebar.focused { box-shadow: inset 0 2px 0 var(--accent); }
.vC .entry.cursor { outline: 2px solid var(--accent); outline-offset: -2px; }
.vC .main.focused > .mainbar { box-shadow: inset 0 2px 0 var(--accent); }
.vC .main:not(.focused) .row.sel { background: var(--bg3); box-shadow: none; }
.av { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.av .ic { width: 12px; height: 12px; }
.av.sm { width: 26px; height: 26px; font-size: 11px; border-radius: 6px; }
.inline-add { margin: 6px 8px 10px; display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 30px; border-radius: 6px; color: var(--fg2); cursor: pointer; white-space: nowrap; }
.inline-add:hover { background: var(--bg3); }
.inline-add span { flex: 1; }
.inline-add.on { background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); cursor: text; }
.inline-add input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); outline: none; font: inherit; padding: 5px 0; }
.suggest { position: fixed; z-index: 30; width: 380px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
.suggest .s-i { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.suggest .s-i .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.suggest .s-i.cur { background: var(--sel); }
.suggest .s-h { padding: 4px 8px; color: var(--fg3); font-size: 11px; }
.rail-list { display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 3px; overflow: auto; flex: 1; }
.rail-i { width: 40px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fg2); flex: none; }
.rail-i:hover { background: var(--bg3); }
.rail-i.active { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--accent); }
.rail-sep { width: 26px; height: 1px; background: var(--line); margin: 5px 0; flex: none; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; flex: 1; }
.crumb { padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg2); display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; max-width: 280px; }
.crumb:hover { background: var(--bg2); color: var(--fg); }
.crumb.last { color: var(--fg); font-weight: 600; cursor: default; flex-shrink: 0; max-width: 460px; }
.crumb.last:hover { background: none; }
.crumb-sep { color: var(--fg3); flex: none; }

/* ---------- modals ---------- */
.modal-bg { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal-bg.top { align-items: flex-start; padding-top: 11vh; }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 82vh; overflow: hidden; }
.m-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.m-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); }
.m-in { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--fg3); }
.m-in input { flex: 1; border: 0; background: none; outline: none; color: var(--fg); font: inherit; font-size: 14px; padding: 11px 0; }
.add-a { width: 760px; height: 540px; max-width: calc(100vw - 32px); }
.add-a .two { display: grid; grid-template-columns: 230px minmax(0, 1fr); flex: 1; min-height: 0; }
.add-a .acc { border-right: 1px solid var(--line); overflow: auto; padding: 8px; background: var(--bg2); }
.add-a .acc-i { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.add-a .acc-i:hover { background: var(--bg3); }
.add-a .acc-i.on { background: var(--sel); font-weight: 600; }
.add-a .acc-i .name { flex: 1; }
.add-a .acc-note { padding: 12px 8px; color: var(--fg3); font-size: 11px; }
.add-a .rp { display: flex; flex-direction: column; min-height: 0; }
.add-a .rl { flex: 1; overflow: auto; padding: 6px; }
.rl-i { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.rl-i .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.rl-i.cur { background: var(--sel); }
.rl-i.dis { color: var(--fg3); cursor: default; }
.cb { width: 16px; height: 16px; border: 1px solid var(--fg3); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.cb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.cb .ic { width: 12px; height: 12px; stroke-width: 2; }
.rl-i.dis .cb.on { background: var(--fg3); border-color: var(--fg3); }
.spot { width: 620px; max-width: calc(100vw - 32px); }
.spot-res { overflow: auto; padding: 6px; max-height: 52vh; }
.spot-g { padding: 8px 8px 2px; font-size: 11px; font-weight: 600; color: var(--fg3); display: flex; align-items: center; gap: 6px; }
.spot-more { padding: 2px 8px 6px 32px; font-size: 11px; color: var(--fg3); }
.spot-foot { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--fg3); font-size: 12px; }
.tracked-ok { color: var(--open); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.help { width: 600px; max-width: calc(100vw - 32px); }
.help-body { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; padding: 14px 16px; overflow: auto; }
.help-body .h-k { text-align: right; }
.help-body .h-sec { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }

/* ---------- prototype chrome (not part of the design being evaluated) ---------- */
#switcher {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 2px;
  background: #111; color: #fff; border-radius: 999px; padding: 4px 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, .45); font-size: 12px;
  border: 1px solid #444;
}
#switcher button { background: none; border: 0; color: #fff; min-width: 28px; height: 28px; border-radius: 999px; cursor: pointer; padding: 0 8px; }
#switcher button:hover { background: #333; }
#switcher .lbl { padding: 0 6px; white-space: nowrap; min-width: 190px; text-align: center; }
#switcher .tag { background: #fbbf24; color: #111; border-radius: 999px; padding: 1px 7px; font-weight: 700; font-size: 10px; letter-spacing: .05em; }
#statebox {
  position: fixed; right: 12px; bottom: 62px; z-index: 99; width: 380px; max-height: 60vh; overflow: auto; background: #111; color: #c9f7c9;
  font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; border-radius: 8px; white-space: pre; display: none; border: 1px solid #444;
}
#toast {
  position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); background: #111; color: #fff; padding: 7px 14px; border-radius: 8px;
  z-index: 101; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; text-align: center; border: 1px solid #444;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher">
  <span class="tag">PROTOTYPE</span>
  <button id="sw-prev" title="Previous variant (Shift+Left)">&#8249;</button>
  <span class="lbl" id="sw-lbl"></span>
  <button id="sw-next" title="Next variant (Shift+Right)">&#8250;</button>
  <button id="sw-state" title="Show the prototype's state (`)">state</button>
</div>
<pre id="statebox"></pre>
<div id="toast"></div>
<script>
'use strict';
// PROTOTYPE, throwaway: no tests, no error handling, globals everywhere on purpose.

const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl+';
const ALT = IS_MAC ? '⌥' : 'Alt+';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

// ---------- icons ----------
const svg = d => `<svg class="ic" viewBox="0 0 16 16">${d}</svg>`;
const I = {
  repo: svg('<path d="M3.5 13.3V2.9c0-.8.6-1.4 1.4-1.4h8.6v9.9H4.9c-.8 0-1.4.6-1.4 1.3s.6 1.3 1.4 1.3h8.6"/>'),
  view: svg('<path d="M2 3h12l-4.6 5.4v4.8l-2.8 1.3V8.4z"/>'),
  all: svg('<path d="M8 1.8 14.2 5 8 8.2 1.8 5z"/><path d="M1.8 8 8 11.2 14.2 8"/><path d="M1.8 11 8 14.2 14.2 11"/>'),
  open: svg('<circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/>'),
  closed: svg('<circle cx="8" cy="8" r="6.2"/><path d="m5.3 8.2 1.9 1.9 3.6-3.8"/>'),
  right: svg('<path d="m6 3.5 4.5 4.5L6 12.5"/>'),
  down: svg('<path d="m3.5 6 4.5 4.5L12.5 6"/>'),
  blocked: svg('<circle cx="8" cy="8" r="6.2"/><path d="m3.7 12.3 8.6-8.6"/>'),
  back: svg('<path d="M13 8H3m4.5-4.5L3 8l4.5 4.5"/>'),

    if (s[j] === q[i]) { score += (j === last + 1 ? 3 : 1) + (j === 0 || '/-_.'.includes(s[j - 1]) ? 2 : 0); last = j; i++; }

const OWNER_REPO = /^[\w.-]+\/[\w.-]+$/;
function searchRepos(q, { includeTracked = true, limit = 40 } = {}) {
  q = q.trim().toLowerCase();
  let hits = ALL_REPOS.filter(r => includeTracked || !isTracked(r))
    .map(r => ({ r, s: fuzzy(q, r.toLowerCase()) })).filter(x => x.s >= 0)
    .sort((a, b) => b.s - a.s || a.r.length - b.r.length).slice(0, limit).map(x => x.r);
  const out = hits.map(full => ({ full, owner: full.split('/')[0], name: full.split('/')[1] }));
  // a typed owner/repo outside the user's accounts: offered first only when nothing known matches
  if (OWNER_REPO.test(q) && !ALL_REPOS.includes(q) && (includeTracked || !isTracked(q))) {
    const free = { full: q, owner: q.split('/')[0], name: q.split('/')[1], free: true };
    out.length ? out.push(free) : out.unshift(free);
  }
  return out;
}

    ['j k / ↑ ↓', 'Move in whichever pane has focus; moving in the sidebar does not switch lists yet'],
    ['← →', 'Collapse / expand; ← on a collapsed top-level issue moves focus into the sidebar'],
    ['→ or ↵ (sidebar)', 'Open that list and move focus into it; Esc returns without switching'],
    ['↵', 'Open the issue page; the sidebar shrinks to a rail'],
    ['Esc or ⌫', 'Back one breadcrumb'],
    [`${ALT}↑ ${ALT}↓`, 'Sidebar focused: move the entry within its owner group (keyboard alternative to drag-and-drop)'],
  ],
  openAdd() {
    S.pages = []; S.modal = 'inline'; render();
    const input = $('inl'), pop = el('<div class="suggest"></div>'), st = { cur: 0, items: [] };
    document.body.append(pop);
    const place = () => { const r = input.getBoundingClientRect(), sr = $('sb').getBoundingClientRect(); pop.style.left = (sr.right + 6) + 'px'; pop.style.bottom = (innerHeight - r.bottom - 4) + 'px'; };
    const draw = () => {
      const q = input.value.trim();
      st.items = q ? searchRepos(q, { includeTracked: false, limit: 9 }) : ALL_REPOS.filter(r => !isTracked(r)).slice(0, 7).map(full => ({ full, owner: full.split('/')[0], name: full.split('/')[1] }));
      st.cur = Math.min(st.cur, Math.max(0, st.items.length - 1));
      pop.innerHTML = (q ? '' : '<div class="s-h">From your accounts. Type to search, or enter owner/repo.</div>')
        + (st.items.map((x, i) => `<div class="s-i ${i === st.cur ? 'cur' : ''}" data-i="${i}">${I.repo}<span class="name">${x.free ? `<b>${esc(x.full)}</b> <span class="muted">· would check access with gh</span>` : `<span class="owner">${esc(x.owner)}/</span>${esc(x.name)}`}</span>${i === st.cur ? '<kbd>↵</kbd>' : ''}</div>`).join('') || '<div class="s-h">No matches among untracked repositories.</div>');
      place();
    };
    const close = () => { pop.remove(); if (S.modal === 'inline') { S.modal = null; render(); } };
    const choose = x => { if (!x) return; trackRepo(x.full); close(); S.focus = 'main'; activate('r:' + x.full); toast(`Now tracking ${x.full}`); };
    input.oninput = () => { st.cur = 0; draw(); };
    input.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'ArrowDown') { st.cur = Math.min(st.items.length - 1, st.cur + 1); draw(); }
      else if (e.key === 'ArrowUp') { st.cur = Math.max(0, st.cur - 1); draw(); }
      else if (e.key === 'Enter') choose(st.items[st.cur]);
      else if (e.key === 'Escape') close();
      else return;
      e.preventDefault();
    };
    input.onblur = () => setTimeout(close, 120);
    pop.onmousedown = e => { const r = e.target.closest('[data-i]'); e.preventDefault(); if (r) choose(st.items[+r.dataset.i]); };
    draw(); input.focus();
  },
};

const VARIANTS = { A, B, C };
const KEYS = Object.keys(VARIANTS);

// ---------- render ----------
function render() {
  const app = $('app');
  if (S.shell !== S.variant) {
    app.innerHTML = '<aside class="sidebar" id="sb"></aside><main class="main" id="mn"></main>';
    S.shell = S.variant;
  }
  app.className = 'v' + S.variant + (app.classList.contains('rail') && S.variant === 'C' ? ' rail' : '');
  V().sidebar(); V().main(); renderState();
  S.justPushed = false;
  $('sw-lbl').textContent = `${S.variant} · ${V().name}`;
}
function renderState() {
  const box = $('statebox');
  if (box.style.display !== 'block') return;
  const ls = lstate(S.active), ord = V().order();
  box.textContent = JSON.stringify({
    variant: `${S.variant} (${V().name})`,
    focus: S.variant === 'B' ? 'list (fixed)' : S.focus,
    sidebarCursor: S.variant === 'C' ? S.sbCursor : undefined,
    active: S.active,
    sidebar: ord.map((id, i) => `${i < 9 ? i + 1 : '·'}  ${plainTitle(id)}`),
    list: { selected: ls.sel, expanded: [...ls.expanded], scrollTop: Math.round(ls.scroll) },
    pages: S.pages.map(p => p.key),
    modal: S.modal,
  }, null, 2);
}
let toastTimer;
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, ms); }
function closeOverlays() { document.querySelectorAll('.modal-bg, .suggest').forEach(n => n.remove()); S.modal = null; }
function setVariant(v) {
  closeOverlays();
  S.variant = v; S.focus = 'main'; S.sbCursor = S.active;
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render(); toast(V().blurb, 4500);
}
const cycle = d => setVariant(KEYS[(KEYS.indexOf(S.variant) + d + KEYS.length) % KEYS.length]);
function openHelp() {
  S.modal = 'help';
  const common = [
    ['a', 'Add a repository'],
    [`${MOD}1–9`, `Jump to a sidebar entry (a browser tab keeps ${MOD}1–9 for itself, so use ${ALT}1–9 here)`],
    ['o', 'Open the selected issue on GitHub'],
    ['?', 'This help'],
  ];
  const proto = [['⇧← ⇧→', 'Switch variant'], ['`', 'Show / hide the state panel']];
  const rows = (h, rs) => `<div class="h-sec">${h}</div>` + rs.map(([k, d]) => `<div class="h-k"><kbd>${esc(k)}</kbd></div><div>${esc(d)}</div>`).join('');
  const bg = el(`<div class="modal-bg"><div class="modal help"><div class="m-head"><b>Keyboard: variant ${S.variant} (${esc(V().name)})</b><span class="sp"></span><kbd>Esc</kbd></div><div class="help-body">${rows('This variant', V().help)}${rows('Everywhere', common)}${rows('Prototype only', proto)}</div></div></div>`);
  bg.onclick = e => { if (e.target === bg) closeHelp(); };
  document.body.append(bg);
}
function closeHelp() { closeOverlays(); render(); }
function toggleState() { const b = $('statebox'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; renderState(); }

// ---------- events ----------
const isTyping = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); };
document.addEventListener('keydown', e => {
  if (['Meta', 'Control', 'Alt'].includes(e.key)) document.body.classList.add('show-sc');
  if (isTyping(e)) return;
  if (e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cycle(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); return; }
  if (S.modal === 'help') { if (e.key === 'Escape' || e.key === '?') { closeHelp(); e.preventDefault(); } return; }
  if (S.modal) return;
  if ((e.metaKey || e.ctrlKey || e.altKey) && /^Digit[1-9]$/.test(e.code)) {
    const id = V().order()[+e.code.slice(5) - 1];
    if (id) { if (S.variant === 'C') S.focus = 'main'; activate(id); }
    e.preventDefault(); return;
  }
  if (e.metaKey || e.ctrlKey) return; // leave browser shortcuts alone
  if (e.key === '?') { openHelp(); e.preventDefault(); return; }
  if (e.key === '`') { toggleState(); e.preventDefault(); return; }
  if (e.key === 'a' && !e.altKey) { V().openAdd(); e.preventDefault(); return; }
  if (V().key(e)) e.preventDefault();
});
document.addEventListener('keyup', e => { if (['Meta', 'Control', 'Alt'].includes(e.key)) document.body.classList.remove('show-sc'); });
window.addEventListener('blur', () => document.body.classList.remove('show-sc'));
// clicked buttons must not keep focus, or Enter would both press them and act on the list
document.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const arg = t.dataset.arg;
  switch (t.dataset.act) {
    case 'entry': V().entryClick(arg); break;
    case 'toggle': toggleExpand(arg); break;
    case 'row': lstate(S.active).sel = arg; openIssue(arg); break;
    case 'open': openIssue(arg); break;
    case 'gh': gh(arg); break;
    case 'tolist': toList(); break;
    case 'pop': popPage(); break;
    case 'popto': popTo(+arg); break;
    case 'add': V().openAdd(); break;
    case 'help': openHelp(); break;
  }
});
// drag-and-drop reordering in the sidebar (a drop is only allowed where the variant's grouping permits it)
function clearDrop() { document.querySelectorAll('.drop-before, .drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after')); S.dropAt = null; }
document.addEventListener('dragstart', e => {
  const en = e.target.closest && e.target.closest('.entry[draggable]');
  if (!en) return;
  S.drag = en.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.drag);
  requestAnimationFrame(() => en.classList.add('dragging'));
});
document.addEventListener('dragover', e => {
  if (!S.drag) return;
  const en = e.target.closest && e.target.closest('.entry');
  clearDrop();
  if (!en || en.dataset.id === S.drag || !V().canDrop(S.drag, en.dataset.id)) return;
  e.preventDefault();
  const r = en.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  en.classList.add(after ? 'drop-after' : 'drop-before');
  S.dropAt = { id: en.dataset.id, after };
});
document.addEventListener('drop', e => { if (S.drag && S.dropAt) { e.preventDefault(); moveRelative(S.drag, S.dropAt.id, S.dropAt.after); } });
document.addEventListener('dragend', () => { clearDrop(); S.drag = null; render(); });

$('sw-prev').onclick = () => cycle(-1);
$('sw-next').onclick = () => cycle(1);
$('sw-state').onclick = toggleState;

const initial = new URL(location.href).searchParams.get('variant');
S.variant = KEYS.includes(initial) ? initial : 'A';
render();
toast(V().blurb, 4500);
</script>
</body>
</html>
