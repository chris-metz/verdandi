# `pnpm package` builds an unpacked, unsigned app for this computer's OS in
# `dist/`. Release delivery (installers, signing, notarization, updates) is
# out of scope for now.
appId: io.github.chris-metz.verdandi
productName: Verdandi
directories:
  output: dist
# electron-vite bundles everything the app runs into `out/`, so no
# `node_modules` are packaged.
files:
  - out/**
  - package.json
mac:
  # Unsigned: runs on the computer that built it.
  identity: null
  # Icon Composer's format, so macOS renders its depth and its dark, tinted
  # and clear appearances. Compiling it needs Xcode 26 or later. Linux and
  # Windows take `build/icon.png`.
  icon: build/icon.icon
linux:
  executableName: verdandi
