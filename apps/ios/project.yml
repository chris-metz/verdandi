# The Xcode project, generated by XcodeGen: `scripts/generate.sh`.
name: Verdandi
options:
  bundleIdPrefix: io.github.chris-metz
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  VerdandiKit:
    path: VerdandiKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D33L6SHDHW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Verdandi:
    type: application
    platform: iOS
    sources:
      - path: Verdandi
        excludes:
          - Resources/core.js
      # Bundled from the core before each build, by the script below.
      - path: Verdandi/Resources/core.js
        optional: true
        buildPhase: resources
      # The desktop app's icon, drawn in Icon Composer's layers.
      - path: ../desktop/build/icon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: VerdandiKit
    preBuildScripts:
      - name: Bundle the core
        script: '"$SRCROOT/scripts/bundle-core.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Verdandi/Resources/core.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chris-metz.verdandi
        PRODUCT_NAME: Verdandi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: icon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Verdandi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    info:
      path: Verdandi/Info.plist
      properties:
        # A GitHub OAuth App's client ID turns on "Sign in with GitHub"
        # (device flow); without one, the user signs in with a token.
        VerdandiGitHubClientID: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  VerdandiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerdandiUITests
    dependencies:
      - target: Verdandi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chris-metz.verdandi.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Verdandi
schemes:
  Verdandi:
    build:
      targets:
        Verdandi: all
        VerdandiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VerdandiUITests
    archive:
      config: Release
