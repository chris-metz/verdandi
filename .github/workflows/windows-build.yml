# Builds the unsigned Windows installer of a release. `release.sh` starts it,
# downloads what it builds and publishes it with the Mac app
# (docs/adr/0009-releases-on-github-and-homebrew.md).
name: Windows build
run-name: Windows build ${{ inputs.version }} (${{ inputs.request }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build, X.Y.Z
        required: true
      commit:
        description: The commit to build
        required: true
      request:
        description: Tells release.sh which run it started
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      # Prettier checks for LF line endings, which Git on Windows would turn
      # into CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      # Node and pnpm in the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @verdandi/desktop build
      - run: >-
          pnpm --filter @verdandi/desktop exec electron-builder
          --win nsis --x64 --publish never
          "-c.extraMetadata.version=$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: verdandi-windows
          path: apps/desktop/dist/Verdandi-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
