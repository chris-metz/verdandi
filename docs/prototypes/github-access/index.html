<!doctype html>
<!--
  THROWAWAY PROTOTYPE — synthetic data, no GitHub calls, no persistence.
  Question: how should Verdandi help when the desktop app cannot find gh?
  Three layouts in the agreed two-column shell, switchable via ?variant=A|B|C.
  Force states via ?scenario=missing|invalid|login|ready and ?os=mac|linux|windows.
  Open this file, or: python3 -m http.server 4178 --bind 127.0.0.1 --directory prototypes/github-access
  File selection, validation, account checks and the repository picker are simulated.
-->
<html lang="en">

*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}a{color:var(--accent);text-underline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.7px;line-height:1.25}h2{font-size:18px;line-height:1.4}h3{font-size:14px}p{color:var(--muted)}code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}small{font-size:12px;color:var(--muted)}.demo-header{height:34px;padding:7px 18px;background:#202b3b;color:#e4eaf1;font-size:11px;letter-spacing:.03em;display:flex;justify-content:space-between}.demo-header b{font-weight:650}.shell{height:calc(100dvh - 122px);min-height:570px;display:grid;grid-template-columns:238px minmax(0,1fr)}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 0}.brand{display:flex;gap:9px;align-items:center;font-weight:650;font-size:16px;padding:0 6px 24px}.mark{height:21px;width:21px;background:linear-gradient(135deg,#8250df,#0969da);border-radius:6px}.nav{padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:9px;font-size:13px}.nav.selected{background:var(--selected);color:var(--accent);font-weight:600}.section-label{font-size:10px;letter-spacing:.09em;font-weight:650;color:var(--muted);margin:23px 10px 8px;display:flex;justify-content:space-between}.nav-empty{font-size:12px;color:var(--soft);padding:0 10px;line-height:1.7}.account{margin-top:auto;border-top:1px solid var(--line);padding:16px 7px;display:flex;gap:9px;align-items:center}.account-icon{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:12px}.account strong{display:block;font-size:12px}.account small{font-size:11px}.main{min-width:0;display:flex;flex-direction:column;position:relative}.mainbar{height:53px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:13px;flex:none}.mainbar span{color:var(--muted);font-size:12px}.stage{flex:1;overflow:auto;position:relative}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:12px}.subtitle{margin-top:10px;max-width:510px}.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:35px;padding:7px 13px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--fg)}.btn:hover{background:var(--panel)}.btn.primary{background:#0969da;border-color:#0969da;color:white}.btn.primary:hover{background:#0756b4}.btn.link{border:0;background:none;color:var(--accent);padding-left:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.alert{margin-top:25px;padding:15px 17px;border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:7px;background:var(--warn-bg);display:flex;gap:11px;align-items:flex-start}.alert .symbol{color:var(--warn);font-size:18px;line-height:1.2}.alert strong{display:block;font-size:13px;margin-bottom:4px}.alert p{font-size:12px;line-height:1.65}.alert.error{border-color:var(--bad)}.alert.error .symbol{color:var(--bad)}.alert.success{background:var(--panel);border-color:var(--good)}.alert.success .symbol{color:var(--good)}.install{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}.install p{font-size:12px;margin:5px 0 10px}.install a{font-size:12px}.command{margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.command code{overflow-wrap:anywhere}.command button{border:0;background:none;color:var(--accent);font-size:12px}.technical{font-size:12px;color:var(--muted);margin-top:22px}.technical summary{cursor:pointer}.technical p{padding:10px 0}.file-path{display:block;font-size:11px;margin-top:8px;overflow-wrap:anywhere}.note{font-size:11px;color:var(--soft);margin-top:12px}.status{font-size:12px;color:var(--muted);margin-top:14px;min-height:18px}.variant-a{max-width:580px;margin:clamp(32px,7vh,76px) auto;padding:0 24px 40px}.variant-b{display:grid;grid-template-columns:190px minmax(0,1fr);max-width:900px;min-height:100%;margin:auto}.steps{border-right:1px solid var(--line);padding:40px 22px;background:var(--panel)}.step{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--soft);margin:0 0 25px}.step b{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);font-size:11px}.step.current{color:var(--accent);font-weight:650}.step.current b{color:white;background:#0969da;border-color:#0969da}.step.done{color:var(--good)}.b-content{padding:43px 36px}.b-content h1{font-size:24px}.b-options{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}.b-option{padding:17px;border:1px solid var(--line);border-radius:7px}.b-option p{font-size:12px;margin:7px 0 12px}.variant-b .alert{margin-top:20px}.variant-c{height:100%;min-height:550px;position:relative;background:var(--panel);display:grid;place-items:center;padding:30px}.c-background{position:absolute;inset:28px;opacity:.32}.skeleton{height:31px;border-bottom:1px solid var(--line)}.skeleton:before{content:'';display:block;width:35%;height:7px;background:var(--line);margin:12px;border-radius:3px}.modal-card{position:relative;max-width:470px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);font-weight:650;font-size:13px;display:flex;justify-content:space-between}.modal-head span{font-weight:400;font-size:11px;color:var(--soft)}.modal-body{padding:25px}.modal-body h1{font-size:23px}.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.modal-body .install{margin-top:21px;padding-top:17px}.modal-body .alert{margin-top:20px}.prototype-toolbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:16px;background:#202b3b;color:#f0f4f8;border:1px solid #536174;border-radius:12px;padding:11px 15px;box-shadow:0 4px 20px #0003;max-width:calc(100% - 24px);white-space:nowrap}.variant-switcher{display:flex;align-items:center;gap:9px}.variant-switcher button{background:#344155;border:1px solid #536174;border-radius:5px;color:#fff;width:28px;height:28px}.variant-switcher b{font-size:12px;width:111px;text-align:center}.prototype-toolbar label{display:flex;gap:6px;align-items:center;font-size:11px}.prototype-toolbar select{background:#344155;border:1px solid #536174;border-radius:5px;padding:4px;font-size:11px;color:white}.state-button{border:0;background:none;color:#bed8ff;font-size:11px;padding:5px}.state-panel{position:fixed;bottom:90px;right:18px;z-index:12;width:360px;max-width:90vw;border-radius:8px;background:#202b3b;color:#eaf0f8;padding:17px;box-shadow:var(--shadow);font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap}.toast{position:fixed;top:45px;left:50%;transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);font-size:12px;padding:10px 17px;border-radius:8px;box-shadow:var(--shadow)}dialog{color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:0;width:560px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}dialog::backdrop{background:#18233077}.dialog-body{padding:24px}.dialog-body p{font-size:12px;margin:6px 0 19px}.file-choice{display:flex;width:100%;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;margin:9px 0;text-align:left;align-items:center;gap:10px}.file-choice:hover{border-color:var(--accent)}.file-choice small{display:block}.repo-layout{display:grid;grid-template-columns:135px 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.repo-filters{background:var(--panel);padding:12px}.repo-filters div{font-size:12px;padding:9px;border-radius:5px}.repo-filters .active{color:var(--accent);background:var(--selected)}.repos{padding:10px 18px}.repo-row{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13px}.repo-search{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px}.empty-ready{text-align:center;padding:70px 24px}.empty-ready .actions{justify-content:center}.empty-ready p{margin-top:10px}
@media(max-width:980px){.shell{grid-template-columns:195px minmax(0,1fr)}.variant-b{grid-template-columns:150px minmax(0,1fr)}.steps{padding:32px 15px}.b-content{padding:32px 24px}.prototype-toolbar{gap:10px}.prototype-toolbar label{gap:4px}.variant-switcher b{width:100px}}
@media(max-width:760px){.shell{grid-template-columns:155px minmax(0,1fr);min-height:650px}.variant-b{display:block}.steps{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:18px;padding:13px}.step{margin:0;font-size:10px;gap:6px}.step b{width:20px;height:20px}.variant-a{margin-top:30px;padding:0 20px 30px}.variant-c{padding:20px}.prototype-toolbar{flex-wrap:wrap;justify-content:center;width:max-content;max-width:96%;gap:7px 14px}.demo-header span{display:none}.b-content{padding:24px}.mainbar{padding:0 18px}}

.variant-c{position:fixed;z-index:5;inset:34px 0 88px;min-height:0;background:#18233066;overflow:auto;padding:24px}

<body>
<div class="demo-header"><b>PROTOTYPE · GitHub access</b><span>Synthetic data · no commands run · nothing is saved</span></div>
<div class="shell"><aside><div class="brand"><span class="mark"></span>Verdandi</div><div class="nav selected">▦ &nbsp;All</div><div class="section-label">Repositories <span>＋</span></div><div class="nav-empty" id="repo-sidebar">No tracked repositories</div><div class="section-label">Views <span>＋</span></div><div class="nav-empty">No saved views</div><div class="account" id="account"></div></aside><main class="main"><header class="mainbar"><strong>All</strong><span id="header-status">GitHub setup</span></header><div class="stage" id="stage"></div></main></div>
<div class="prototype-toolbar" aria-label="Prototype controls"><div class="variant-switcher"><button id="prev" aria-label="Previous layout">←</button><b id="variant-name"></b><button id="next" aria-label="Next layout">→</button></div><label>Platform <select id="platform"><option value="mac">macOS</option><option value="linux">Linux</option><option value="windows">Windows</option></select></label><label>Scenario <select id="scenario"><option value="missing">gh not found</option><option value="invalid">Invalid executable</option><option value="login">Sign-in needed</option><option value="ready">Connected</option></select></label><button class="state-button" id="state-toggle">State</button><button class="state-button" id="reset">Reset</button></div>
<pre id="state-panel" class="state-panel" hidden></pre><div id="toast" class="toast" role="status" hidden></div><dialog id="picker"></dialog><dialog id="repositories"></dialog>
<script>
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URL(location.href).searchParams;
const variants={A:'One page',B:'Guided steps',C:'Setup dialog'};
const states=['missing','invalid','login','ready'];
const S={variant:variants[params.get('variant')]?params.get('variant'):'C',scenario:states.includes(params.get('scenario'))?params.get('scenario'):'missing',os:['mac','linux','windows'].includes(params.get('os'))?params.get('os'):'mac',path:null,checking:false,message:'',tracked:[],screen:'setup'};
let revision=0;
const paths=()=>S.os==='windows'?['C:\\Program Files\\GitHub CLI\\gh.exe','C:\\Tools\\gh.exe']:S.os==='linux'?['/usr/bin/gh','/usr/local/bin/gh']:['/opt/homebrew/bin/gh','/usr/local/bin/gh'];
const btn=(label,action,primary=false)=>`<button class="btn${primary?' primary':''}" data-act="${action}" ${S.checking?'disabled':''}>${label}</button>`;
const command=(text)=>`<div class="command"><code>${escapeHTML(text)}</code><button data-copy="${escapeHTML(text)}">Copy</button></div>`;
function statusHTML(){
 if(S.checking)return '<div class="alert"><span class="symbol">◌</span><div><strong>Checking GitHub CLI…</strong><p>Looking for gh and verifying access to github.com.</p></div></div>';
 const data={missing:['!','GitHub CLI not found','Verdandi couldn’t find gh. It may be installed in a location this app can’t see.',''],invalid:['!','This file cannot be used','Choose the gh executable, not an installer, shortcut or another file.','error'],login:['!','Sign in to GitHub','GitHub CLI is available. Complete sign-in in your terminal, then come back and check again.',''],ready:['✓','Connected to github.com','Verdandi is using demo-user through GitHub CLI.','success']}[S.scenario];
 return `<div class="alert ${data[3]}" role="status"><span class="symbol">${data[0]}</span><div><strong>${data[1]}</strong><p>${data[2]}</p>${S.path?`<code class="file-path">${escapeHTML(S.path)}</code>`:''}</div></div>`;
}
function installation(){return `<div class="install"><h3>Need to install GitHub CLI?</h3><p>Install gh for ${S.os==='mac'?'macOS':S.os==='linux'?'your Linux distribution':'Windows'}, then choose “Check again”.</p><a href="https://github.com/cli/cli#installation" target="_blank" rel="noreferrer">Open installation instructions ↗</a></div>`}
function details(){return `<details class="technical"><summary>gh works in my terminal</summary><p>Desktop apps can see a different set of program locations. Choose your gh executable above, or reopen Verdandi after updating your PATH.</p><p>To check GitHub CLI in your terminal:</p>${command('gh --version')}</details>`}
function actions(){return S.scenario==='ready'?btn('Choose repositories','repos',true):S.scenario==='login'?btn('Check again','check',true)+btn('Choose a different executable…','choose'):btn('Choose gh executable…','choose',true)+btn('Check again','check')}
function extras(){return S.scenario==='login'?command('gh auth login --hostname github.com'):S.scenario==='ready'?'<p class="note">Nothing is tracked until you choose it. You can also skip and create a view.</p>':installation()+details()}
function VariantA(){return `<section class="variant-a"><div class="eyebrow">GitHub setup</div><h1>${S.scenario==='ready'?'You’re ready to explore':'Connect Verdandi to GitHub'}</h1><p class="subtitle">Verdandi uses your GitHub CLI account to read issues across repositories.</p>${statusHTML()}${S.scenario==='login'?extras():''}<div class="actions">${actions()}${S.scenario==='ready'?btn('Skip for now','skip'):''}</div>${S.scenario!=='login'?extras():''}<p class="status" aria-live="polite">${escapeHTML(S.message)}</p></section>`}
function VariantB(){const n=S.scenario==='ready'?3:S.scenario==='login'?2:1;return `<section class="variant-b"><nav class="steps" aria-label="Setup steps">${['Find GitHub CLI','Check account','Choose repositories'].map((label,i)=>`<div class="step ${i+1===n?'current':i+1<n?'done':''}"><b>${i+1<n?'✓':i+1}</b><span>${label}</span></div>`).join('')}</nav><div class="b-content"><div class="eyebrow">Step ${n} of 3</div><h1>${n===1?'Find GitHub CLI':n===2?'Connect your account':'Choose what to follow'}</h1><p class="subtitle">${n===1?'Use your existing installation, or install gh to get started.':'Verdandi follows the account used by GitHub CLI.'}</p>${statusHTML()}${n===1?`<div class="b-options"><div class="b-option"><h3>Already installed?</h3><p>Select the gh program on your computer.</p>${btn('Choose gh executable…','choose',true)}</div><div class="b-option"><h3>Install GitHub CLI</h3><p>Follow the instructions for your operating system.</p><a href="https://github.com/cli/cli#installation" target="_blank" rel="noreferrer">Installation instructions ↗</a></div></div><div class="actions">${btn('Check again','check')}</div>${details()}`:`${n===2?extras():''}<div class="actions">${actions()}${n===3?btn('Skip for now','skip'):''}</div>${n===3?extras():''}`}<p class="status" aria-live="polite">${escapeHTML(S.message)}</p></div></section>`}
function VariantC(){return `<section class="variant-c"><div class="modal-card" role="dialog" aria-modal="true" aria-label="GitHub setup"><div class="modal-head">GitHub setup <span>github.com</span></div><div class="modal-body"><h1>${S.scenario==='ready'?'Your account is connected':'Let’s connect GitHub'}</h1><p class="subtitle">${S.scenario==='ready'?'Use GitHub CLI to read your repositories.':'Set up GitHub CLI to start using Verdandi.'}</p>${statusHTML()}${extras()}<p class="status" aria-live="polite">${escapeHTML(S.message)}</p></div><div class="modal-foot">${S.scenario==='ready'?btn('Skip','skip'):''}${actions()}</div></div></section>`}
function syncURL(){const u=new URL(location.href);u.searchParams.set('variant',S.variant);u.searchParams.set('scenario',S.scenario);u.searchParams.set('os',S.os);history.replaceState(null,'',u)}
function statePanel(){const state={...S,effectiveAccount:S.scenario==='ready'?'demo-user':null,host:'github.com',simulation:true};$('state-panel').textContent=JSON.stringify(state,null,2);console.info('Prototype state',state)}
function render(){
 const prototypeFocus=document.activeElement?.closest('.prototype-toolbar');
 $('variant-name').textContent=`${S.variant} · ${variants[S.variant]}`;$('platform').value=S.os;$('scenario').value=S.scenario;
 $('account').innerHTML=`<div class="account-icon">${S.scenario==='ready'?'D':'?'}</div><div><strong>${S.scenario==='ready'?'demo-user':'Not connected'}</strong><small>github.com${S.scenario==='ready'?' · via gh':''}</small></div>`;
 $('header-status').textContent=S.screen==='setup'?'GitHub setup':S.scenario==='ready'?'Connected as demo-user':'';
 $('repo-sidebar').textContent=S.tracked.length?S.tracked.join(' · '):'No tracked repositories';
 $('stage').innerHTML=S.screen==='app'?`<div class="empty-ready"><h2>${S.tracked.length?'Repositories added':'Make this space yours'}</h2><p>${S.tracked.length?escapeHTML(S.tracked.join(', ')):'Add repositories, or start with a saved search view.'}</p><div class="actions">${btn('Add repositories','repos',true)}${btn('Back to setup preview','setup')}</div><p class="note">This prototype ends at repository selection.</p></div>`:({A:VariantA,B:VariantB,C:VariantC}[S.variant])();
 const blocking=S.variant==='C'&&S.screen==='setup';
 document.querySelector('.shell > aside').inert=blocking;
 document.querySelector('.mainbar').inert=blocking;
 if(blocking&&!prototypeFocus)document.querySelector('.modal-card [data-act]')?.focus();
 syncURL();statePanel();
}
function switchVariant(d){const k=Object.keys(variants);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];render()}
function choose(){const d=$('picker');d.innerHTML=`<div class="modal-head">Choose gh executable <span>Simulated file picker</span></div><div class="dialog-body"><p>Choose a sample file to preview validation. No files on your computer are read.</p>${paths().map(path=>`<button class="file-choice" data-path="${escapeHTML(path)}"><span>▧</span><span><code>${escapeHTML(path)}</code><small>GitHub CLI executable</small></span></button>`).join('')}<button class="file-choice" data-path="${S.os==='windows'?'C:\\Downloads\\notes.txt':'/example/notes.txt'}" data-invalid="true"><span>▧</span><span>notes.txt<small>Preview an invalid file</small></span></button></div><div class="modal-foot">${btn('Cancel','cancel-file')}</div>`;d.showModal()}
function check(next){const r=++revision;S.checking=true;S.message='';render();setTimeout(()=>{if(revision!==r)return;S.checking=false;if(next)S.scenario=next;else if(S.scenario==='login')S.scenario='ready';else S.message=S.scenario==='missing'?'Still unable to find gh. Choose its location or install it first.':'Choose a working gh executable and try again.';render();if(S.scenario==='ready')openRepos()},600)}
function openRepos(){const d=$('repositories');d.innerHTML=`<div class="modal-head">Add repositories <span>demo-user · github.com</span></div><div class="dialog-body"><input class="repo-search" aria-label="Repository search preview" placeholder="Filter suggestions, or enter owner/repo or a GitHub URL" disabled><p style="margin-bottom:0">Preview of the existing picker; synthetic repositories.</p></div><div class="repo-layout"><div class="repo-filters"><div class="active">Suggestions</div><div>demo-user</div><div>harbor-team</div></div><div class="repos">${['demo-user/planner','harbor-team/ui-kit','community/roadmap'].map((r,i)=>`<label class="repo-row"><input type="checkbox" value="${r}" ${i===0?'checked':''}>${r}</label>`).join('')}</div></div><div class="modal-foot">${btn('Skip for now','skip-repos')}${btn('Add selected','add-repos',true)}</div>`;d.showModal()}
let toastTimer;function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2500)}
document.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);toast('Command copied')}catch{toast('Select the command text to copy it')}return}const path=e.target.closest('[data-path]');if(path){$('picker').close();S.path=path.dataset.path;check(path.dataset.invalid?'invalid':'login');return}const b=e.target.closest('[data-act]');if(!b)return;switch(b.dataset.act){case'choose':choose();break;case'cancel-file':$('picker').close();break;case'check':check();break;case'repos':openRepos();break;case'skip':S.screen='app';render();break;case'skip-repos':$('repositories').close();S.screen='app';render();break;case'add-repos':S.tracked=[...$('repositories').querySelectorAll('input:checked')].map(i=>i.value);$('repositories').close();S.screen='app';render();break;case'setup':S.screen='setup';render();break}});
function reset(scenario='missing'){revision++;Object.assign(S,{scenario,path:null,checking:false,message:'',tracked:[],screen:'setup'});$('picker').close();$('repositories').close();render()}
function focusSetup(){const b=$('stage').querySelector('button');b?.focus()}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('dialog[open]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
$('prev').onclick=()=>switchVariant(-1);$('next').onclick=()=>switchVariant(1);$('platform').onchange=e=>{S.os=e.target.value;reset(S.scenario)};$('scenario').onchange=e=>reset(e.target.value);$('reset').onclick=()=>reset();$('state-toggle').onclick=()=>{$('state-panel').hidden=!$('state-panel').hidden;statePanel()};render();
</script>
</body>
</html>
